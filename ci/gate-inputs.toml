version = 1
gate_matrix_version = 1

[runner]
label = "ubuntu-24.04"
bash_minimum = "5.2"
bash_maximum_exclusive = "6"
system_packages = ["libssl-dev", "pkg-config"]

[tools]
rust_msrv = "1.95"
rust_stable = "stable"
mdbook = "0.5.4"
python = "3.14"

[rust_components]
G01 = []
G02 = []
G03 = []
G04 = []
G05 = []
G06 = []
G07 = ["clippy"]
G07b = ["clippy"]
G08 = ["rustfmt"]
G09a = []
G09b = []

# RFC 093 Gate Matrix v1 (rfcs/done/093-build-toolchain-release-gates.md),
# machine-readable expansion. scripts/ci-gate.sh executes these commands
# verbatim; scripts/check-gate-inputs.sh (A3.4) verifies this table matches
# the RFC's table exactly. Do not paraphrase, wrap, or reorder a command here
# without amending the RFC first.
[gates]
G01 = "cargo +1.95 build --workspace --all-targets --locked"
G02 = "cargo +1.95 test --workspace --locked"
G03 = "cargo +1.95 build --workspace --all-targets --all-features --locked"
G04 = "cargo +1.95 test --workspace --all-features --locked"
G05 = "cargo +stable build --workspace --all-targets --locked && cargo +stable test --workspace --locked"
G06 = "cargo +stable build --workspace --all-targets --all-features --locked && cargo +stable test --workspace --all-features --locked"
G07 = "cargo +stable clippy --workspace --all-targets --all-features --locked -- -D warnings"
G07b = "cargo +stable clippy --workspace --all-targets --locked -- -D warnings"
G08 = "cargo +stable fmt --all -- --check"
G09a = "cargo +1.95 test -p sui-id-store --features ldap --test ldap_smoke --locked -- --exact rustls_provider_and_tls_connector_reach_fixture"
G09b = "cargo +stable test -p sui-id-store --features ldap --test ldap_smoke --locked -- --exact rustls_provider_and_tls_connector_reach_fixture"
G10a = "mdbook build docs --dest-dir target/mdbook-gate"
G10b = "python3.14 scripts/check-markdown-links.py --root . README.md ROADMAP.md docs"
G11 = "python3.14 scripts/check-rfc-integrity.py --root . --policy ci/rfc-policy.toml"

# RFC 093 M1b C2.1: the lane-completeness rule (scripts/check-gate-inputs.sh
# condition 7) requires every lane in the Gate Matrix v1 table above to be
# either a [gates] key or listed here, never both, never neither. This list
# is meant to stay this short: a lane belongs here only when it predates the
# dispatcher and already has its own working, independently reviewed entry
# point -- not as a place to defer wiring a new lane.
[gate_matrix_exceptions]
G12 = "Predates ci-gate.sh and has its own working entry point (ui-invariants-v1, RFC 093 M1a). Not migrated: churning a green gate for symmetry is not worth the risk. Currently also a dependency of M1b C5 -- a reason not to touch it right now, not a claim that this exception can never be revisited."

