name: Publish to crates.io

# RFC 141: publishing is a workflow, not a credential. Mints a
# short-lived crates.io token per crate via Trusted Publishing (OIDC)
# instead of a long-lived CARGO_REGISTRY_TOKEN on a workstation, and
# verifies Level B on the exact tagged commit before any token is
# minted -- the check a person performs today (release-process.md's
# own step 5), automated here so the publish cannot skip it. A
# workflow that minted tokens without that check would *weaken* RFC
# 131 D2 by removing the person who was reading it, not strengthen it.
#
# Four jobs, in order: `verify` (Level B and release identity, RFC
# 141 §3), `build-artifacts` (builds, checks and attests the static
# release binaries, RFC 143 stage 2, calling release-artifacts.yml),
# `publish` (the six crates.io mints and publishes, RFC 141 §4), and
# `github-release` (creates the Release from what `build-artifacts`
# already attested, RFC 143 stage 3). See release-process.md's own
# "What runs, in order" for what each refuses and how to recover.
#
# Triggered by workflow_dispatch, not a tag push: anyone who can push
# a tag must not thereby be able to publish (RFC 141 §2). The
# `publish` job runs in the `release` GitHub Environment and does not
# start until `verify` has reported Level B. The environment has NO
# required reviewer. @nabbisen, 2026-11-08: "Denied. It is for release
# stability and treated as a future improvement, for the configuration
# harms productivity now." So the dispatch of this workflow is itself the
# approval; see release-process.md, step 3. RFC 141 §2's reviewer remains
# the intended shape, deferred.
#
# `rust-lang/crates-io-auth-action@v1` cannot be pinned by a bare `v1`
# in this repository (A3.4 condition 1 requires a 40-hex commit SHA in
# any hand-written workflow; condition 2 requires that SHA to be
# recorded in contracts/gate-inputs.toml's [actions] table, where it
# is, as `crates_io_auth_action_v1`). `v1` is a branch on that repo,
# not a tag; it currently points at the same commit as the latest
# `v1.0.x` release tag -- see the round's own review package for how
# that was verified.
#
# 0.86.0 does not publish through this (RFC 141 §7, settled
# 2026-10-28): the workflow is built and its refusal fixtures exercised
# in 0.86.0, and 0.87.0 is the first release published through it.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to publish, e.g. 0.87.0 (no leading v)"
        required: true
        type: string

jobs:
  verify:
    name: Verify Level B and release identity
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Install Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      # RFC 141 §3 + RFC 143 stage 2 fix round 2b: refuses before
      # crates-io-auth-action ever runs, in the `publish` job below,
      # unless all five conditions hold -- a CI workflow_dispatch run on
      # this exact commit concluded success with 0 skipped jobs, a
      # Security audit run on the same commit concluded success, the tag
      # is annotated and on `main`, the six Cargo.toml version fields
      # equal it, and *this run itself* was dispatched directly against
      # the tag (not a branch with the tag as a mere string input) --
      # the condition that makes `github.sha`, used below, provably the
      # tagged commit rather than a value that merely usually agrees
      # with it. The tag input and the run's ref type, ref name and
      # commit all go through `env:`, not templated into the script
      # text, so a surprising `tag` input is shell data, never shell
      # syntax.
      - name: Verify Level B and release identity
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_REF_TYPE: ${{ github.ref_type }}
          RUN_REF_NAME: ${{ github.ref_name }}
          RUN_SHA: ${{ github.sha }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python3.14 scripts/check-publish-preconditions.py \
            --root . \
            --repo "${{ github.repository }}" \
            --tag "$TAG" \
            --token "$GH_TOKEN" \
            --run-ref-type "$RUN_REF_TYPE" \
            --run-ref-name "$RUN_REF_NAME" \
            --run-sha "$RUN_SHA"
          # `github.sha` is the tagged commit by construction, proven by
          # the check above rather than assumed -- not re-resolved via a
          # second `git rev-parse`, so there is exactly one value for
          # "the commit this release is", not two that happen to agree.
          echo "sha=$RUN_SHA" >> "$GITHUB_OUTPUT"

  build-artifacts:
    name: Build, check and attest release artifacts
    needs: verify
    # RFC 143 stage 2 C1: the build happens before any `cargo publish`
    # step, on the exact commit `verify` already vouched for, so a build
    # failure costs nothing -- nothing has been published yet. No `ref`
    # input (fix round 2b): `release-artifacts.yml` takes none, and
    # checks out `github.sha`, which `verify`'s own guard has already
    # made the tagged commit for this entire run.
    uses: ./.github/workflows/release-artifacts.yml
    permissions:
      contents: read
      id-token: write
      attestations: write

  publish:
    name: Publish six crates
    needs: [verify, build-artifacts]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      id-token: write
      contents: read
    steps:
      # Checked out at the exact commit `verify` resolved and already
      # vouched for -- not the tag string again, so there is no second
      # resolution for the tag to have moved between the two jobs.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.verify.outputs.sha }}

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      # RFC 141 §4: six explicit sequential steps, in the dependency
      # order docs/src/contributing/release-process.md documents --
      # not a loop over a list, so the order is readable as six lines
      # rather than inferred from data. `cargo publish` waits for the
      # crate to reach the index before returning, so the next step's
      # dependency resolution needs no hand-tuned sleep.

      # 1. Foundation: shared types (no internal deps)
      - name: Authenticate with crates.io (sui-id-shared)
        id: auth-shared
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1 (v1.0.6)
      - name: Publish sui-id-shared
        id: publish-shared
        run: cargo publish -p sui-id-shared
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-shared.outputs.token }}

      # 2. Foundation: i18n (no internal deps)
      - name: Authenticate with crates.io (sui-id-i18n)
        id: auth-i18n
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1 (v1.0.6)
      - name: Publish sui-id-i18n
        id: publish-i18n
        run: cargo publish -p sui-id-i18n
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-i18n.outputs.token }}

      # 3. Storage: depends on sui-id-shared
      - name: Authenticate with crates.io (sui-id-store)
        id: auth-store
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1 (v1.0.6)
      - name: Publish sui-id-store
        id: publish-store
        run: cargo publish -p sui-id-store
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-store.outputs.token }}

      # 4. Domain logic: depends on sui-id-shared, sui-id-store, sui-id-i18n
      - name: Authenticate with crates.io (sui-id-core)
        id: auth-core
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1 (v1.0.6)
      - name: Publish sui-id-core
        id: publish-core
        run: cargo publish -p sui-id-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-core.outputs.token }}

      # 5. UI: depends on sui-id-shared, sui-id-store, sui-id-i18n
      - name: Authenticate with crates.io (sui-id-web)
        id: auth-web
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1 (v1.0.6)
      - name: Publish sui-id-web
        id: publish-web
        run: cargo publish -p sui-id-web
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-web.outputs.token }}

      # 6. Binary crate: depends on all five
      - name: Authenticate with crates.io (sui-id)
        id: auth-bin
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1 (v1.0.6)
      - name: Publish sui-id
        id: publish-bin
        run: cargo publish -p sui-id
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth-bin.outputs.token }}

      # RFC 141 §4: a partial publish must be reported as a partial
      # publish, naming exactly which crates already reached the
      # registry -- the state `cargo yank` cannot undo, and the only
      # state a later retry must not re-publish. Runs whenever any
      # earlier step in this job failed; a step after the failure is
      # "skipped", never "success", so only the crates that truly
      # published are named.
      - name: Report a partial publish, if the job failed
        if: failure()
        run: |
          echo "::error::Publish did not complete all six crates. No GitHub Release was created -- github-release needs this job to succeed first."
          echo "Crates already on the registry (do not re-run this workflow for them -- retry only from the next one):"
          ok=0
          for pair in "sui-id-shared:${{ steps.publish-shared.outcome }}" \
                      "sui-id-i18n:${{ steps.publish-i18n.outcome }}" \
                      "sui-id-store:${{ steps.publish-store.outcome }}" \
                      "sui-id-core:${{ steps.publish-core.outcome }}" \
                      "sui-id-web:${{ steps.publish-web.outcome }}" \
                      "sui-id:${{ steps.publish-bin.outcome }}"; do
            name="${pair%%:*}"
            outcome="${pair##*:}"
            if [ "$outcome" = "success" ]; then
              echo "  - $name"
              ok=$((ok + 1))
            fi
          done
          if [ "$ok" -eq 0 ]; then
            echo "  (none -- the failure was before the first publish step completed)"
          fi

  github-release:
    name: Create the GitHub Release
    needs: [verify, build-artifacts, publish]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      # The exact SHA `release-artifacts.yml` already uploaded under
      # (RFC 143 stage 3 C1): adds no new action, touches no
      # `[actions]` row.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-artifacts
          path: dist

      - name: Confirm what is about to be attached is what was attested
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS

      - name: Refuse if a Release for this tag already exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::error::a Release for $TAG already exists -- refusing to overwrite it" >&2
            exit 1
          fi

      - name: Create the Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # --verify-tag aborts if the tag does not exist, so this step
          # can never create one; --notes-file, never --generate-notes,
          # since the notes are already rendered (RFC 143 stage 3 A/B).
          gh release create "$TAG" --repo "${{ github.repository }}" --verify-tag \
            --title "sui-id $TAG" --notes-file dist/release-notes.md \
            dist/sui-id-x86_64-unknown-linux-musl \
            dist/sui-id-aarch64-unknown-linux-musl \
            dist/SHA256SUMS

      - name: Confirm the Release has exactly the three expected assets, each matching SHA256SUMS
        # RFC 143 stage 3 C4. Measured 2026-11-09: the release-asset API
        # does carry a digest (GitHub's own REST API description,
        # `components.schemas.release-asset.digest`: `{"type":
        # "string", "nullable": true}`, listed as a `required` response
        # field; `gh release view`'s own source
        # (pkg/cmd/release/view/view.go) prints it as the "Digest"
        # column, read from the identical field). Its prefix was not
        # independently confirmed against a real release by this
        # round -- `${digest#sha256:}` strips one if present and is a
        # no-op otherwise, so the comparison is correct either way.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          names=$(gh release view "$TAG" --repo "${{ github.repository }}" --json assets --jq '[.assets[].name] | sort | join(",")')
          expected="SHA256SUMS,sui-id-aarch64-unknown-linux-musl,sui-id-x86_64-unknown-linux-musl"
          if [ "$names" != "$expected" ]; then
            echo "::error::Release $TAG has unexpected assets: $names (expected: $expected)" >&2
            exit 1
          fi
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets \
            --jq '.assets[] | "\(.name) \(.digest)"' > asset-digests.txt
          cat asset-digests.txt
          # SHA256SUMS is itself an asset and cannot list itself, so it is
          # checked against its own hash; every other asset against its
          # line in it. (Before this, the SHA256SUMS row found no line,
          # and the step failed on every release -- after the Release was
          # created.) The Release API gives `sha256:<hex>`, measured
          # 2026-11-09 on cli/cli v2.103.3's assets.
          while read -r name digest; do
            if [ "$name" = "SHA256SUMS" ]; then
              want=$(sha256sum dist/SHA256SUMS | cut -d' ' -f1)
            else
              want=$(awk -v n="$name" '$2 == n { print $1 }' dist/SHA256SUMS)
            fi
            if [ -z "$want" ]; then
              echo "::error::asset $name is not listed in SHA256SUMS" >&2
              exit 1
            fi
            if [ -z "$digest" ] || [ "$digest" = "null" ]; then
              echo "::error::the Release API returned no digest for asset $name" >&2
              exit 1
            fi
            got="${digest#sha256:}"
            if [ "$got" != "$want" ]; then
              echo "::error::asset $name digest mismatch: Release API says $got, SHA256SUMS says $want" >&2
              exit 1
            fi
          done < asset-digests.txt

      - name: Report a failure, if this job did not complete
        # RFC 143 stage 3 (stage 3's own failure-reporting requirement).
        # By the time this job runs, all six crates are already
        # published (its own `needs:` requires `publish` to have
        # succeeded) -- a failure here means the Release is missing, or
        # exists but failed the check after creation; never the crates.
        #
        # The recommended recovery, re-running only this job, rests on
        # two claims from GitHub's own docs
        # (docs/actions/how-tos/manage-workflow-runs/re-run-workflows-
        # and-jobs.md, fetched 2026-11-09): "When you re-run failed jobs
        # or a specific job, GitHub also re-runs the jobs that depend on
        # them" -- this job has none, so only it re-runs -- and "Jobs
        # that aren't included keep their outputs from the previous
        # attempt, which the newly run jobs can use" -- so
        # `build-artifacts`'s uploaded `release-artifacts` artifact,
        # from the attempt that is not re-run, is still there for this
        # job's own `download-artifact` step to find. Neither claim was
        # proven against a real re-run by this round; the manual command
        # is given regardless, since it costs nothing extra and does not
        # depend on either claim holding.
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          # A failure after `gh release create` leaves a Release that
          # exists but did not pass the check above, so ask rather than
          # assume which case this is.
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::All six crates are published. A GitHub Release for $TAG WAS created, but the check after creating it failed (see the step above). Do not re-run this job: it refuses because the Release exists. Inspect the Release's assets against SHA256SUMS; if they are wrong, delete the Release and its assets (not the tag), then re-run this job." >&2
            exit 0
          fi
          echo "::error::All six crates are published. The GitHub Release was not created." >&2
          echo "Recovery: re-run only this job (\"Re-run failed jobs\", or re-run this specific job) -- GitHub's own docs say a re-run of a job with nothing depending on it re-runs only that job, and reuses the other jobs' outputs from this attempt, including the artifact this job downloads." >&2
          echo "If that does not work, create the Release by hand:" >&2
          echo "  gh release create $TAG --repo $REPO --verify-tag --title \"sui-id $TAG\" --notes-file release-notes.md sui-id-x86_64-unknown-linux-musl sui-id-aarch64-unknown-linux-musl SHA256SUMS" >&2
          echo "(after downloading the release-artifacts workflow artifact from this run, with gh run download)." >&2
