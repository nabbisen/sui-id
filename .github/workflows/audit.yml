name: Security audit

# Runs cargo-audit against the dependency tree to flag known
# vulnerabilities and unmaintained crates from the RustSec advisory
# database.
#
# Triggers:
# - On every push to main and on every PR (so a new dependency that
#   pulls in a vulnerable transitive doesn't slip in unnoticed).
# - On a weekly schedule (so an advisory published *after* a
#   dependency was added still gets caught — RustSec's database
#   updates continually).
# - Manually via the Actions tab if a release is being prepared.
#
# cargo-audit is installed explicitly with a pinned version and
# `--locked`, rather than via rustsec/audit-check.
#
# Why: the action installs cargo-audit *without* `--locked`, so it
# re-resolves cargo-audit's own dependency tree on every run. On
# 2026-09-03 that resolution drifted into a `tinyvec` version that no
# longer compiles, and the job failed while building the tool -- before
# it ever read Cargo.lock. The workflow was red for a reason unrelated
# to this project's dependencies, and, worse, no advisory scanning had
# happened since 2026-09-02 while the lane looked merely "broken".
#
# `--locked` makes cargo-audit build against the lockfile it was
# published with, so an unrelated upstream release cannot break this
# lane again.
#
# Trade recorded: the action filed a GitHub issue when a fresh advisory
# hit a previously-clean tree. Direct invocation does not, which is why
# `issues: write` is no longer requested. If that behaviour is wanted
# back, it should be a step that runs on failure, not a reason to keep
# an installer that breaks.

on:
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - ".github/workflows/audit.yml"
  schedule:
    # Wednesdays at 06:13 UTC. Off-business-hours, off-the-hour to
    # avoid a thundering herd of GitHub-scheduled jobs.
    - cron: "13 6 * * 3"
  workflow_dispatch:

jobs:
  audit:
    name: cargo audit
    # Pinned rather than ubuntu-latest, matching the [runner] label the
    # Gate Matrix pins in ci/gate-inputs.toml. A security lane should not
    # be the one place the runner is allowed to drift.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install cargo-audit (pinned, --locked)
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Run cargo audit
        # --deny unsound --deny yanked, but NOT unmaintained. Owner decision,
        # 2026-09-05. unsound is a defect and yanked is nearly always a
        # one-line patch bump away, so both should block. unmaintained is
        # neither: it fires on transitive build-time crates nobody here can
        # remove -- today paste and proc-macro-error2, both reached through
        # proc-macro chains -- and a lane that is permanently red for reasons
        # no one can act on is the same as no lane at all.
        #
        # The policy was verified satisfiable before being adopted: it exits 0
        # on this tree as of d7959e9. A policy adopted while already violated
        # gets an allow list on day one, and allow lists grow.
        #
        # Per-advisory escape hatch is --ignore RUSTSEC-YYYY-NNNN with the
        # reason recorded here -- a deliberate, visible, single decision rather
        # than exempting a whole category.
        #
        # The exit code is captured rather than failing the step, so the
        # proof-of-scan check below still runs and still writes the summary
        # when an advisory is denied. The job fails at the last step instead.
        shell: bash
        run: |
          set -o pipefail
          rc=0
          cargo audit --deny unsound --deny yanked 2>&1 | tee audit-output.txt || rc=$?
          echo "$rc" > audit-exit-code.txt
          echo "cargo audit exited $rc"

      - name: Prove the scan actually happened
        # A green audit lane must mean "the advisory database was read and
        # this project's lockfile was scanned", not "the command exited 0".
        # cargo audit exits 0 both when it scanned a clean tree and, in
        # principle, when it scanned nothing -- so assert the scan line and
        # a plausible dependency count rather than trusting the exit status.
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -qE 'Scanning Cargo\.lock for vulnerabilities \([0-9]+ crate dependencies\)' audit-output.txt; then
            echo "::error::cargo audit produced no scan line -- it did not read Cargo.lock" >&2
            exit 1
          fi
          n=$(grep -oE 'vulnerabilities \([0-9]+ crate' audit-output.txt | grep -oE '[0-9]+')
          echo "cargo audit scanned $n crate dependencies"
          if [ "$n" -lt 100 ]; then
            echo "::error::only $n crates scanned; this workspace has far more -- wrong directory or truncated lockfile" >&2
            exit 1
          fi
          w=$(grep -cE '^Warning:' audit-output.txt || true)
          echo "### cargo audit: $n crates scanned, $w advisory warning(s)" >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(Crate|Warning|Title|ID):' audit-output.txt >> "$GITHUB_STEP_SUMMARY" || true

      - name: Fail if cargo audit denied an advisory
        # Deliberately last: by now the scan is proven to have happened and the
        # summary is written, so a red job always says which advisory and on
        # how many crates -- never just "the tool exited non-zero".
        shell: bash
        run: |
          set -euo pipefail
          rc=$(cat audit-exit-code.txt)
          if [ "$rc" -ne 0 ]; then
            echo "::error::cargo audit denied an advisory (exit $rc); see the job summary" >&2
            exit "$rc"
          fi
