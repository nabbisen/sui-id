name: Release artifacts

# RFC 143 stage 2, part C: builds, checks and attests the static release
# binaries on the tagged commit, before any of publish.yml's six `cargo
# publish` steps -- a build failure here costs nothing, because nothing has
# been published yet (RFC 143 D1).
#
# Reusable (`workflow_call`) so publish.yml can run it as one job in the
# real release, and `workflow_dispatch` so the rehearsal (stage 2 C3) can
# run the exact same jobs against an arbitrary commit -- the tip of `main`
# by default -- publishing nothing and creating no Release.
#
# Why raw `docker run` instead of the `services:` key for the LDAP/SMTP
# check job: a service container starts before any job step runs,
# including `actions/checkout`, so there is no point at which a step could
# hand it a freshly generated TLS certificate before it boots -- and
# osixia/openldap's own baked-in example CA is already expired (stage 1,
# 2026-11-08, confirmed its validity ended January 2026). Plain `docker
# run` steps give this job the ordering `services:` cannot: checkout, then
# generate certs, then start the LDAP/SMTP containers with those certs,
# then run the just-built binary against them on the same user-defined
# network, reached by container name -- the same thing stage 1 already
# proved end-to-end with podman, translated to the `docker` CLI every
# GitHub-hosted runner already has.
#
# Every external action this file `uses` is pinned to a 40-hex commit SHA
# and recorded in contracts/gate-inputs.toml's [actions] table (A3.4
# conditions 1-2); this file is not exempt -- scripts/check-gate-inputs.sh
# excludes only ci.yml by name and reads every other file in
# .github/workflows/. Every container image any step `docker run`s is
# pinned by digest for the same reason, resolved freshly for this round (a
# `:latest` tag's referent can move between resolutions, which is exactly
# what pinning by digest forecloses).

on:
  # RFC 143 stage 2 fix round 2b: no `ref` input, on either trigger. A
  # build-provenance attestation records the *run's own* triggering
  # ref/commit (`github.sha`), never a `ref:` a step happens to
  # `actions/checkout` -- so a `ref` input here would only invite the
  # exact mismatch fix round 2 closed for `publish.yml`: a rehearsal
  # dispatched against `main` while naming `ref: <something else>`
  # would build that other commit and attest `main`'s tip, and the
  # attestation is signed into Rekor's public, append-only log, where a
  # false one cannot be withdrawn. `github.sha` is always exactly what
  # this run was dispatched against, by construction, with no second
  # value to ever disagree with it. A rehearsal of a specific ref is
  # `gh workflow run release-artifacts.yml --ref <ref>`, which keeps
  # "what was checked out" and "what gets attested" equal the same way.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  announce:
    name: Announce (rehearsal or release)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Say what this run is
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "### This is a rehearsal" >> "$GITHUB_STEP_SUMMARY"
            echo "Builds, checks and attests \`${{ github.sha }}\`. It publishes nothing and creates no GitHub Release." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Release build" >> "$GITHUB_STEP_SUMMARY"
            echo "Builds, checks and attests \`${{ github.sha }}\`, called by publish.yml." >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: "build (${{ matrix.target }})"
    needs: announce
    strategy:
      fail-fast: false
      matrix:
        include:
          # RFC 143 stage 2 C2.1: aarch64 builds natively here, not
          # cross-compiled -- stage 1's Zig cross-toolchain recipe is not
          # reused. The native runner's own architecture IS aarch64, so
          # none of stage 1's three cross-compile fixes (the `-target`
          # collision, the duplicate `_start`, `-C link-self-contained=no`)
          # are needed, and this build is checked for PIE, which stage 1's
          # cross-compiled one lost only to that workaround.
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            cc_env: CC_x86_64_unknown_linux_musl
            linker_env: CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER
            # openssl-src's own target-to-Configure-name mapping
            # (src/lib.rs), read 2026-11-09 rather than guessed.
            openssl_configure_target: linux-x86_64
            # library/debian:stable-slim, amd64 manifest digest, resolved
            # 2026-11-08.
            debian_digest: "sha256:cd9f2189b62dc5ce003b22ad8cb109bbc3cef8ddcc8bc13771472a6edeb16980"
            # rustc's own x86_64-unknown-linux-musl target spec sets
            # `static_position_independent_executables = true`
            # (compiler/rustc_target/src/spec/targets/
            # x86_64_unknown_linux_musl.rs) -- static-PIE is this target's
            # *proven* default, now also confirmed by the 2026-11-09
            # rehearsal run (`static-pie linked`, both the file(1) check
            # and the bare-container run-check passed). Hard assertion.
            require_pie: "true"
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            cc_env: CC_aarch64_unknown_linux_musl
            linker_env: CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER
            openssl_configure_target: linux-aarch64
            # library/debian:stable-slim, arm64/v8 manifest digest,
            # resolved 2026-11-08.
            debian_digest: "sha256:04bba436c86dbce81eac09593099a9b468c49c3ed4835820ba71bb27b135fedb"
            # Not PIE, and no stable flag can make it so (measured
            # 2026-11-09, rustc 1.99.1). This target's spec
            # (compiler/rustc_target/src/spec/targets/
            # aarch64_unknown_linux_musl.rs) does not set
            # `static_position_independent_executables`; x86_64's does.
            # And rustc's link_output_kind
            # (compiler/rustc_codegen_ssa/src/back/link.rs:2272) downgrades
            # the output itself:
            #   StaticPicExe if !static_pic_exe_supported => StaticNoPicExe
            # So `-C relocation-model=pie` compiles PIC code but still links
            # a non-PIE static executable. Only a custom target spec could
            # change it, and that needs nightly, against `rust_stable =
            # "stable"`. Reported, not enforced: if rustc ever opts this
            # target in, the summary shows `pie: yes`, and this row is
            # flipped to "true" deliberately.
            require_pie: "false"
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      # No `ref:` -- see the `on:` block's own comment above. This
      # checks out `github.sha`, the commit this run was itself
      # dispatched against, which is exactly what the attestation
      # records too.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Install musl build packages
        # RFC 143 stage 1: the runner's `perl` is full already (unlike the
        # `rust:1.95-slim` container stage 1 built in), but `musl-tools`
        # and `make` are not installed by default. `binutils` (RFC 143
        # stage 5, measured 2026-11-09 on a bare `ubuntu:24.04` --
        # `musl-tools` alone pulls in `binutils-x86_64-linux-gnu`, which
        # provides `x86_64-linux-gnu-as`, but not the bare `as` symlink
        # gcc's own search path looks for; "cannot execute 'as'" without
        # it) and `gcc` (same measurement: the host-target build scripts
        # proc-macro crates compile need a *host* `cc`, which `musl-
        # tools` does not provide either) are both already present on
        # GitHub's own hosted runner image (confirmed from `actions/
        # runner-images`' own Ubuntu2404-Readme.md), so this is
        # self-sufficiency, not a gap this round actually hit in CI.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools binutils gcc make perl file

      - name: Download and verify OpenSSL source
        # RFC 143 stage 5 part A/B1: `contracts/openssl.toml` is the one
        # place this version and hash are written; a bump there is the
        # entire pinning procedure. Parsed with grep/sed, not a TOML
        # library: every value is a single-line `key = "value"`, and
        # this job has no Python step to spend on a parser for that.
        run: |
          set -euo pipefail
          series=$(grep -E '^series' contracts/openssl.toml | sed -E 's/^series = "([^"]+)"/\1/')
          version=$(grep -E '^openssl_version' contracts/openssl.toml | sed -E 's/^openssl_version = "([^"]+)"/\1/')
          sha256=$(grep -E '^sha256' contracts/openssl.toml | sed -E 's/^sha256 = "([^"]+)"/\1/')
          url_template=$(grep -E '^url_template' contracts/openssl.toml | sed -E 's/^url_template = "([^"]+)"/\1/')
          url=${url_template//\{version\}/$version}
          echo "OPENSSL_SERIES=$series" >> "$GITHUB_ENV"
          echo "OPENSSL_VERSION=$version" >> "$GITHUB_ENV"
          mkdir -p openssl-src
          curl -fLsS -o openssl-src/openssl.tar.gz "$url"
          echo "$sha256  openssl-src/openssl.tar.gz" | sha256sum -c -

      - name: Build a static OpenSSL for this target
        # RFC 143 stage 5 part B2. `no-engine`/`no-async`/
        # `-DOPENSSL_NO_SECURE_MEMORY` are not this round's own
        # invention: they are `openssl-src`'s (the now-removed crate's)
        # own musl-specific flags (src/lib.rs), carried over because it
        # had already solved the exact problem a bare musl-gcc hits
        # here -- no kernel headers on its include path for the
        # `linux/version.h` the engine module wants, or the
        # `linux/mman.h` the secure-memory code wants
        # (openssl/openssl#7207). Measured 2026-11-09, on this runner's
        # own base image: both headers are genuinely absent
        # (`musl-gcc -E -x c -` on each reports "No such file or
        # directory"), and `./Configure` + `make` succeed with these
        # three flags and no kernel-headers package installed at all.
        run: |
          set -euo pipefail
          cd openssl-src
          tar xzf openssl.tar.gz
          cd "openssl-$OPENSSL_VERSION"
          # Installed under RUNNER_TEMP, not /opt: the build then needs no
          # write access outside the job's own temporary space, on either
          # runner image. (ubuntu-24.04's image happens to `chmod -R 777
          # /opt`; the arm64 image is built separately, and nothing here
          # should depend on that detail.)
          prefix="$RUNNER_TEMP/openssl"
          # The flags are the withdrawn `vendored` build's own defaults
          # (openssl-src, src/lib.rs, main branch), so the static OpenSSL
          # carries no more than it did:
          # - no-shared, no-module: static libraries only, and no provider
          #   built as a loadable module. Without no-module, aarch64's
          #   providers/legacy.so fails to link (`undefined reference to
          #   __getauxval`, from libgcc's lse-init.o under musl). Rehearsal
          #   42793365084.
          # - no-legacy, no-ssl3, no-md2, no-rc5, no-weak-ssl-ciphers,
          #   no-camellia, no-idea, no-seed, no-comp, no-zlib,
          #   no-zlib-dynamic: algorithms and features passkey verification
          #   never uses (it needs ES256, RS256 and EdDSA), left out
          #   rather than shipped.
          # - no-engine, no-async, -DOPENSSL_NO_SECURE_MEMORY: musl, as
          #   explained above.
          CC=musl-gcc ./Configure ${{ matrix.openssl_configure_target }} \
            no-shared no-module no-tests \
            no-legacy no-ssl3 no-md2 no-rc5 no-weak-ssl-ciphers \
            no-camellia no-idea no-seed no-comp no-zlib no-zlib-dynamic \
            no-engine no-async -DOPENSSL_NO_SECURE_MEMORY \
            --prefix="$prefix" --libdir=lib --openssldir=/etc/ssl
          # Libraries and headers only, as openssl-src builds them
          # (`build_libs`, `install_dev`). The `openssl` command-line
          # program is never needed, and on aarch64 it cannot link:
          # Ubuntu's gcc compiles outline atomics, whose libgcc
          # initialiser (lse-init.o) calls glibc's `__getauxval`, which
          # musl does not provide under that name (rehearsal 42795045566).
          # sui-id itself links, because Rust's compiler_builtins supplies
          # those atomic helpers and libgcc's are never pulled in.
          make -j"$(nproc)" build_libs
          make install_dev
          test -f "$prefix/lib/libcrypto.a" && test -f "$prefix/lib/libssl.a"
          grep -E '^# *define OPENSSL_VERSION_TEXT' "$prefix/include/openssl/opensslv.h" \
            | tee -a "$GITHUB_STEP_SUMMARY"
          grep -qE "^# *define OPENSSL_VERSION_TEXT +\"OpenSSL $OPENSSL_VERSION " \
            "$prefix/include/openssl/opensslv.h"
          echo "OPENSSL_DIR=$prefix" >> "$GITHUB_ENV"
          echo "OPENSSL_STATIC=1" >> "$GITHUB_ENV"

      - name: Build (static, OpenSSL ${{ matrix.target }})
        # OPENSSL_DIR and OPENSSL_STATIC come from the step above.
        run: |
          set -euo pipefail
          export "${{ matrix.cc_env }}=musl-gcc"
          export "${{ matrix.linker_env }}=musl-gcc"
          # `--locked`, as every gate builds: a lockfile inconsistent with
          # Cargo.toml must fail here, never be silently re-resolved, or the
          # artifact would carry dependency versions Level B and the audit
          # never saw. The compiler is recorded too, because the attestation
          # names the workflow and the commit, not the toolchain.
          rustc -Vv | tee -a "$GITHUB_STEP_SUMMARY"
          cargo build --release --locked -p sui-id --features ldap --target ${{ matrix.target }}

      - name: Assert the binary embeds exactly the pinned OpenSSL version
        # RFC 143 stage 5 part B4. `OpenSSL ` with a trailing space
        # distinguishes the real version banner from any other string
        # that happens to start with "OpenSSL" (there is none today,
        # but the trailing space is the actual anchor, not a guess).
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/sui-id"
          found=$(strings "$bin" | grep -E '^OpenSSL [0-9]+\.[0-9]+\.[0-9]+ ' | sort -u)
          echo "embedded OpenSSL version string(s): $found" | tee -a "$GITHUB_STEP_SUMMARY"
          n=$(printf '%s\n' "$found" | grep -c .)
          if [ "$n" -ne 1 ] || ! printf '%s' "$found" | grep -q "^OpenSSL $OPENSSL_VERSION "; then
            echo "::error::expected exactly one 'OpenSSL $OPENSSL_VERSION ' string, found: $found" >&2
            exit 1
          fi

      - name: Build and run the OpenSSL probe (part F's real-crypto check)
        # RFC 143 stage 5 part B5/F. No test in the repository signs a
        # real passkey assertion, so without this, the shipped binary's
        # OpenSSL signature-verification path (ES256/RS256/EdDSA, what
        # `COSEKey::verify_signature` actually calls) is exercised
        # nowhere. The probe's own `assert!`s fail the process -- and
        # this step -- on a wrong result.
        run: |
          set -euo pipefail
          export "${{ matrix.cc_env }}=musl-gcc"
          export "${{ matrix.linker_env }}=musl-gcc"
          cargo build --release --locked -p sui-id --example openssl_probe --target ${{ matrix.target }}
          probe="target/${{ matrix.target }}/release/examples/openssl_probe"
          file "$probe"
          # The probe is a normal dynamically-runnable artifact for its
          # own architecture, which is this runner's own on both matrix
          # legs (x86_64 or native aarch64) -- no emulation needed.
          "$probe" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Prove the binary is static (file, ldd) and report PIE
        run: |
          set -euo pipefail
          bin="target/${{ matrix.target }}/release/sui-id"
          file "$bin" | tee file-output.txt
          if ! grep -qE 'static-pie linked|statically linked' file-output.txt; then
            echo "::error::$bin is not statically linked (file(1) output above)" >&2
            exit 1
          fi
          if grep -q 'pie executable' file-output.txt; then
            echo "pie: yes" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ matrix.require_pie }}" = "true" ]; then
            echo "pie: no" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$bin is not PIE, and this target (${{ matrix.target }}) is proven to produce static-PIE by default -- a regression" >&2
            exit 1
          else
            echo "pie: no (rustc's own target spec does not request static-PIE for ${{ matrix.target }}; see the matrix comment above -- reported, not enforced, until that changes upstream)" >> "$GITHUB_STEP_SUMMARY"
          fi
          ldd "$bin" > ldd-output.txt 2>&1 || true
          cat ldd-output.txt
          if grep -q '=>' ldd-output.txt; then
            echo "::error::ldd resolved a dynamic library against $bin -- not static" >&2
            exit 1
          fi

      - name: Run it in a bare debian:stable-slim with only ca-certificates
        # RFC 143 stage 1 §3: a literal `scratch` image, or any base image
        # with genuinely zero CA certificates, cannot serve anything --
        # part A fixes the startup panic, but the setup redirect itself
        # still needs outbound-TLS-capable clients to exist for nothing
        # here, so the one runtime requirement is `ca-certificates`.
        run: |
          set -euo pipefail
          mkdir -p bare data
          cp "target/${{ matrix.target }}/release/sui-id" bare/sui-id
          cat > bare/sui-id.toml <<'EOF'
          [server]
          listen_addr = "0.0.0.0:8801"
          issuer = "http://127.0.0.1:18801"
          cookie_secure = false
          trusted_proxies = []

          [storage]
          db_path = "/data/sui-id.sqlite"
          key_file = "/data/sui-id.key"

          [tokens]
          access_lifetime_secs = 900
          id_token_lifetime_secs = 900
          refresh_lifetime_secs = 1209600

          [log]
          format = "json"
          filter = "info,sui_id=info,sui_id_core=info,sui_id_store=info"

          [security]
          max_lockout = "24h"
          EOF

          docker run -d --name bare-run \
            -p 18801:8801 \
            -v "$PWD/bare/sui-id":/usr/local/bin/sui-id:ro \
            -v "$PWD/bare/sui-id.toml":/etc/sui-id.toml:ro \
            -v "$PWD/data":/data \
            "debian@${{ matrix.debian_digest }}" \
            sh -c 'apt-get update -qq && apt-get install -y -qq ca-certificates && exec /usr/local/bin/sui-id --config /etc/sui-id.toml'

          ok=""
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18801/ || echo 000)
            if [ "$code" = "303" ]; then ok=1; break; fi
            sleep 1
          done
          echo "--- container log ---"
          docker logs bare-run || true
          if [ -z "$ok" ]; then
            echo "::error::sui-id did not serve the 303 setup redirect inside a bare debian:stable-slim + ca-certificates container" >&2
            docker rm -f bare-run || true
            exit 1
          fi
          loc=$(curl -s -o /dev/null -w '%{redirect_url}' http://127.0.0.1:18801/)
          docker rm -f bare-run
          case "$loc" in
            */setup*) echo "redirect target: $loc (ok)" ;;
            *) echo "::error::redirect target was not /setup (got: $loc)" >&2; exit 1 ;;
          esac

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sui-id-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/sui-id
          if-no-files-found: error

  ldap-smtp-check:
    name: "LDAP + SMTP check (x86_64 musl binary -- RFC 143 condition 1, every release)"
    needs: build
    # Runs only against the x86_64 artifact: this job executes the built
    # binary directly (not under emulation), and only an amd64 runner can
    # run an x86_64-unknown-linux-musl binary without one. Stage 1 made the
    # identical choice for the identical reason.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sui-id-x86_64-unknown-linux-musl
          path: bin

      - name: Generate TLS certs for LDAP and SMTP
        # RFC 143 stage 1: osixia/openldap's own baked-in example CA
        # expired in January 2026, so a fresh CA + leaf cert is generated
        # here every run, exactly as stage 1 did with podman.
        run: |
          set -euo pipefail
          mkdir -p certs
          openssl genrsa -out certs/ca.key 4096
          openssl req -x509 -new -key certs/ca.key -days 1 -out certs/ca.crt \
            -subj "/CN=sui-id-release-check-ca"
          for name in sui-id-release-ldap sui-id-release-smtp; do
            openssl genrsa -out "certs/$name.key" 2048
            openssl req -new -key "certs/$name.key" -out "certs/$name.csr" \
              -subj "/CN=$name" -addext "subjectAltName=DNS:$name"
            openssl x509 -req -in "certs/$name.csr" -CA certs/ca.crt -CAkey certs/ca.key \
              -CAcreateserial -days 1 -out "certs/$name.crt" \
              -extfile <(echo "subjectAltName=DNS:$name")
          done

      - name: Start the LDAP and SMTP containers on a user-defined network
        run: |
          set -euo pipefail
          docker network create sui-id-release-check-net

          # osixia/openldap:1.5.0, amd64 manifest digest, resolved
          # 2026-11-08 (same image stage 1 used).
          #
          # `--copy-service` (reproduced locally with podman, 2026-11-09,
          # using these exact arguments): the image's own entrypoint
          # `chown`s everything under /container/service/slapd/assets/certs
          # at startup, which fails outright against a `:ro` bind mount
          # ("Read-only file system") and kills the container before slapd
          # ever starts. `--copy-service` makes the entrypoint copy
          # /container/service to a writable /container/run/service first
          # and chown that copy instead -- the bind-mounted certs
          # underneath are read, never written, so `:ro` still means what
          # it says for them.
          #
          # `LDAP_TLS_VERIFY_CLIENT=never`: the image defaults to `demand`,
          # so slapd refuses any client that presents no certificate
          # ("TLS: can't accept: No certificate was found"), and sui-id
          # presents none -- its LDAP client has no client-certificate
          # setting (`LdapConnSettings::new()`, ldap_source.rs). The
          # server's certificate is still verified by sui-id against the
          # generated CA; only the mutual-TLS demand, which sui-id cannot
          # meet, is turned off. Rehearsal 42535043149 failed on exactly
          # this. Note that `openssl s_client` prints "Verify return
          # code: 0 (ok)" even when slapd rejects it, because that line
          # reports the *client's* check of the server, so the server's
          # log is the evidence.
          docker run -d --name sui-id-release-ldap --network sui-id-release-check-net \
            -e LDAP_TLS_VERIFY_CLIENT=never \
            -e LDAP_TLS_CRT_FILENAME=ldap.crt \
            -e LDAP_TLS_KEY_FILENAME=ldap.key \
            -e LDAP_TLS_CA_CRT_FILENAME=ca.crt \
            -e LDAP_ADMIN_PASSWORD=release-check-admin-pw \
            -v "$PWD/certs/sui-id-release-ldap.crt":/container/service/slapd/assets/certs/ldap.crt:ro \
            -v "$PWD/certs/sui-id-release-ldap.key":/container/service/slapd/assets/certs/ldap.key:ro \
            -v "$PWD/certs/ca.crt":/container/service/slapd/assets/certs/ca.crt:ro \
            osixia/openldap@sha256:0de3850635911109f0daf8f5957808ec4f4eb827fbaaa339100b5f1bab925745 \
            --copy-service

          # axllent/mailpit:latest, amd64 manifest digest, resolved
          # 2026-11-08 (stage 1's own recorded digest had already moved by
          # the time this round resolved it -- exactly what digest-pinning
          # forecloses from here on).
          docker run -d --name sui-id-release-smtp --network sui-id-release-check-net \
            -e MP_SMTP_TLS_CERT=/certs/sui-id-release-smtp.crt \
            -e MP_SMTP_TLS_KEY=/certs/sui-id-release-smtp.key \
            -v "$PWD/certs":/certs:ro \
            axllent/mailpit@sha256:c95e8356f55b65520e8b7fd4d74d3e2d06e4a83513f639e316b1e592fbd52646

          ready=""
          for _ in $(seq 1 30); do
            docker exec sui-id-release-ldap ldapwhoami -x -H ldap://localhost -D "" >/dev/null 2>&1 && { ready=1; break; }
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "::error::OpenLDAP never answered ldapwhoami within 30s" >&2
            docker logs sui-id-release-ldap || true
            exit 1
          fi

      - name: Seed the LDAP test user (alice)
        run: |
          set -euo pipefail
          cat > seed.ldif <<'EOF'
          dn: ou=people,dc=example,dc=org
          objectClass: organizationalUnit
          ou: people

          dn: uid=alice,ou=people,dc=example,dc=org
          objectClass: inetOrgPerson
          uid: alice
          cn: Alice Example
          sn: Example
          mail: alice@example.org
          userPassword: alice-release-check-pw
          EOF
          docker cp seed.ldif sui-id-release-ldap:/seed.ldif
          docker exec sui-id-release-ldap ldapadd -x -D "cn=admin,dc=example,dc=org" \
            -w release-check-admin-pw -f /seed.ldif

      - name: Start the built sui-id binary, pointed at both
        run: |
          set -euo pipefail
          chmod +x bin/sui-id
          mkdir -p data
          cat > sui-id-check.toml <<'EOF'
          [server]
          listen_addr = "0.0.0.0:8801"
          issuer = "http://sui-id-release-check:8801"
          cookie_secure = false
          trusted_proxies = []

          [storage]
          db_path = "/data/sui-id.sqlite"
          key_file = "/data/sui-id.key"

          [tokens]
          access_lifetime_secs = 900
          id_token_lifetime_secs = 900
          refresh_lifetime_secs = 1209600

          [log]
          format = "json"
          # The two lines asserted below are `tracing::debug!`
          # (sui-id-store/src/user_source.rs, "user-source cascade
          # matched"; sui-id-core/src/communication/mail/outbox.rs,
          # "outbox: mail sent"), so their two targets are raised to
          # debug and nothing else is. At "info" neither line is ever
          # emitted, and rehearsal 42535940718 failed on exactly that
          # while slapd's own log showed alice's bind succeeding. The
          # outbox's target is `sui_id_core::mail::outbox`: lib.rs
          # declares the module with `#[path]`, which moves the file
          # but not the module path.
          filter = "info,sui_id_store::user_source=debug,sui_id_core::mail::outbox=debug"

          [security]
          max_lockout = "24h"

          [[user_sources]]
          kind = "ldap"
          slug = "release-check-ldap"
          url = "ldaps://sui-id-release-ldap:636"
          bind_dn = "cn=admin,dc=example,dc=org"
          bind_password_env = "RELEASE_CHECK_LDAP_BIND_PW"
          user_search_base = "ou=people,dc=example,dc=org"
          user_search_filter = "(uid={username})"
          stable_id_attribute = "entryUUID"
          display_name_attribute = "cn"
          email_attribute = "mail"
          EOF

          docker run -d --name sui-id-release-check --network sui-id-release-check-net \
            -e RELEASE_CHECK_LDAP_BIND_PW=release-check-admin-pw \
            -v "$PWD/bin/sui-id":/usr/local/bin/sui-id:ro \
            -v "$PWD/sui-id-check.toml":/etc/sui-id.toml:ro \
            -v "$PWD/certs/ca.crt":/usr/local/share/ca-certificates/sui-id-release-check-ca.crt:ro \
            -v "$PWD/data":/data \
            "debian@sha256:cd9f2189b62dc5ce003b22ad8cb109bbc3cef8ddcc8bc13771472a6edeb16980" \
            sh -c 'apt-get update -qq && apt-get install -y -qq ca-certificates && update-ca-certificates && exec /usr/local/bin/sui-id --config /etc/sui-id.toml'

          ready=""
          for _ in $(seq 1 60); do
            docker logs sui-id-release-check 2>&1 | grep -q 'listening' && { ready=1; break; }
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "::error::sui-id-release-check never logged 'listening' within 60s" >&2
            docker logs sui-id-release-check || true
            exit 1
          fi

      - name: Drive the LDAP sign-in and the SMTP send, from the same network
        # RFC 143 stage 2 C2.3: the LDAP assertion is on the log line, not
        # HTTP status -- a non-admin LDAP-sourced user gets the generic
        # 200 failure page by design (RFC 102 A7), identical to stage 1's
        # own finding. The admin's own password-reset is used for the SMTP
        # leg (alice has no local password to reset) and its own `_csrf`
        # token is scraped because /admin/settings/email and
        # /forgot-password both enforce it; /setup/admin and /admin/login
        # do not.
        run: |
          set -euo pipefail
          cat > check.sh <<'SCRIPT'
          set -eu
          BASE=http://sui-id-release-check:8801
          JAR=/tmp/cookies.txt

          i=0
          while [ "$i" -lt 60 ]; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$BASE/" || echo 000)
            [ "$code" != "000" ] && break
            i=$((i+1)); sleep 1
          done

          curl -s -c "$JAR" -b "$JAR" -o /dev/null "$BASE/setup/admin"
          curl -s -c "$JAR" -b "$JAR" -o /dev/null "$BASE/setup/admin" \
            --data-urlencode "setup_token=__TOKEN__" \
            --data-urlencode "username=release-check-admin" \
            --data-urlencode "email=release-check-admin@example.org" \
            --data-urlencode "password=release-check-admin-pw-1!" \
            --data-urlencode "confirm_password=release-check-admin-pw-1!"

          csrf=$(curl -s -c "$JAR" -b "$JAR" "$BASE/admin/settings/email" \
            | grep -o 'name="_csrf"[^>]*value="[^"]*"' | head -1 \
            | sed -E 's/.*value="([^"]*)".*/\1/')
          curl -s -c "$JAR" -b "$JAR" -o /dev/null "$BASE/admin/settings/email" \
            --data-urlencode "_csrf=$csrf" \
            --data-urlencode "enabled=true" \
            --data-urlencode "host=sui-id-release-smtp" \
            --data-urlencode "port=1025" \
            --data-urlencode "tls_mode=starttls" \
            --data-urlencode "from_address=release-check@example.org" \
            --data-urlencode "base_url=$BASE"

          curl -s -o /dev/null "$BASE/admin/login" \
            --data-urlencode "username=alice" \
            --data-urlencode "password=alice-release-check-pw"

          csrf2=$(curl -s -c "$JAR" -b "$JAR" "$BASE/forgot-password" \
            | grep -o 'name="_csrf"[^>]*value="[^"]*"' | head -1 \
            | sed -E 's/.*value="([^"]*)".*/\1/')
          curl -s -c "$JAR" -b "$JAR" -o /dev/null "$BASE/forgot-password" \
            --data-urlencode "_csrf=$csrf2" \
            --data-urlencode "email=release-check-admin@example.org"

          sleep 8
          SCRIPT

          # `cut -d=` is not used here: the token is standard base64 and
          # could in principle contain `=` padding, which `cut -d=` would
          # truncate at. `sed` strips only the leading `token=` prefix.
          token=$(docker logs sui-id-release-check 2>&1 | grep -oE 'token=[^& ]+' | tail -1 | sed 's/^token=//')
          if [ -z "$token" ]; then
            echo "::error::could not read the setup token from sui-id-release-check's own log" >&2
            docker logs sui-id-release-check || true
            exit 1
          fi
          # The setup token is standard base64 (base64ct::Base64) and can
          # contain `/`, so `|` is the sed delimiter here, not `/`.
          sed -i "s|__TOKEN__|$token|" check.sh

          docker run --rm --network sui-id-release-check-net \
            -v "$PWD/check.sh":/check.sh:ro \
            --entrypoint sh curlimages/curl@sha256:3b8fde20978e330b401837f24b871ebe2c8d14ff7f07b87990bcd832588a1a75 \
            /check.sh

      - name: Assert the LDAP and SMTP log lines
        run: |
          set -euo pipefail
          echo "--- sui-id-release-check log ---"
          docker logs sui-id-release-check 2>&1 | tee app.log
          if ! grep -q 'user-source cascade matched' app.log; then
            echo "::error::LDAP sign-in never produced the 'user-source cascade matched' log line" >&2
            exit 1
          fi
          if ! grep -q 'outbox: mail sent' app.log; then
            echo "::error::the forgot-password send never produced the 'outbox: mail sent' log line" >&2
            exit 1
          fi
          echo "--- mailpit API (secondary confirmation) ---"
          docker run --rm --network sui-id-release-check-net \
            curlimages/curl@sha256:3b8fde20978e330b401837f24b871ebe2c8d14ff7f07b87990bcd832588a1a75 \
            -s "http://sui-id-release-smtp:8025/api/v1/messages" | tee mailpit.json
          grep -q '"total":[1-9]' mailpit.json

      - name: Dump every container's log, on failure
        # Each container's own log is already dumped at its own failure
        # point above (readiness loops, the log-line assertions); this is
        # the catch-all for a failure in between those points -- a step
        # that never got the chance to look at any container's log before
        # dying, such as the driver script itself.
        if: failure()
        run: |
          for c in sui-id-release-check sui-id-release-ldap sui-id-release-smtp; do
            echo "=== docker logs $c ==="
            docker logs "$c" 2>&1 || echo "(no such container, or it never started)"
          done

      - name: Tear down
        if: always()
        run: |
          docker rm -f sui-id-release-check sui-id-release-ldap sui-id-release-smtp 2>/dev/null || true
          docker network rm sui-id-release-check-net 2>/dev/null || true

  provenance:
    name: SHA256SUMS, notes, attest, verify, upload
    needs: [build, ldap-smtp-check]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # RFC 143 stage 2 C2.5: granted to this job only, never
      # workflow-wide -- attest-build-provenance mints a Sigstore identity
      # token and signs the build's provenance with it.
      id-token: write
      # RFC 143 stage 3 part B: `gh attestation verify` below reads the
      # same scope, not a second one. GitHub's own REST API description
      # for `GET /repos/{owner}/{repo}/attestations/{subject_digest}`
      # (the endpoint `gh attestation verify --repo` calls --
      # confirmed by reading cli/cli's own
      # pkg/cmd/attestation/api/client.go) says: "a fine-grained access
      # token requires the attestations:read permission." `attestations:
      # write|read|none` is one setting, not two independent ones
      # (contracts/gate-inputs.toml's own convention, and every
      # GITHUB_TOKEN scope GitHub documents), and workflow-syntax's own
      # wording -- a forked-repo PR's permissions are "adjusted to
      # change any write permissions to read only" -- only makes sense
      # if `write` already carries whatever `read` would have granted.
      # No second permission added; if a rehearsal's own verify step
      # ever reports 403, that reading was wrong and this comment (and
      # the one on the permissions line) says exactly what to recheck.
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Render the release notes
        # RFC 143 stage 3 part A/B. The version is the tag name on a real
        # release, "Unreleased" on a rehearsal (any other ref); `--ref`
        # pins the rewritten link targets to the same ref either way, so
        # a rehearsal's own notes point at `main` and a release's point
        # at the tag.
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = "tag" ]; then
            version="$REF_NAME"
          else
            version="Unreleased"
          fi
          python3.14 scripts/extract-changelog-section.py \
            --changelog CHANGELOG.md \
            --version "$version" \
            --repo "${{ github.repository }}" \
            --ref "$REF_NAME" \
            --root . \
            > release-notes.md
          {
            echo "### Release notes (version: $version)"
            echo
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sui-id-x86_64-unknown-linux-musl
          path: release/x86_64-unknown-linux-musl

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sui-id-aarch64-unknown-linux-musl
          path: release/aarch64-unknown-linux-musl

      - name: Rename, checksum, and add the release notes to the bundle
        run: |
          set -euo pipefail
          mkdir -p dist
          cp release/x86_64-unknown-linux-musl/sui-id dist/sui-id-x86_64-unknown-linux-musl
          cp release/aarch64-unknown-linux-musl/sui-id dist/sui-id-aarch64-unknown-linux-musl
          cp release-notes.md dist/release-notes.md
          cd dist
          sha256sum sui-id-x86_64-unknown-linux-musl sui-id-aarch64-unknown-linux-musl > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance (per artifact)
        # `release-notes.md` is deliberately not a subject here: it is
        # not a build artifact, has no `SHA256SUMS` entry, and stage 3 C1
        # downloads it alongside the two binaries but attests nothing
        # about it -- there is nothing about release notes a build
        # attestation could truthfully claim.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4 (v4.2.2)
        with:
          subject-path: "dist/sui-id-x86_64-unknown-linux-musl,dist/sui-id-aarch64-unknown-linux-musl,dist/SHA256SUMS"

      - name: Verify, exactly as an operator will
        # RFC 143 stage 3 part B2. `--source-ref "$GITHUB_REF"` filters
        # to attestations made by *this* ref's own runs, so a rehearsal
        # build of `main` can never satisfy a tag's own check (and,
        # symmetrically, stage 3 C1's pre-attach verification must use
        # the same filter against the tag).
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS
          for f in sui-id-x86_64-unknown-linux-musl sui-id-aarch64-unknown-linux-musl SHA256SUMS; do
            gh attestation verify "$f" --repo "${{ github.repository }}" --source-ref "$GITHUB_REF"
            echo "verified: $f (source ref $GITHUB_REF)"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-artifacts
          path: dist/*
          if-no-files-found: error
