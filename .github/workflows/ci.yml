name: CI

# Build and test on every push and PR. Kept deliberately minimal
# (one Linux + stable toolchain matrix) to keep CI fast; we cover
# audit and lints in their own files.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # RFC 093 Gate Matrix v1 (A3.5): a global RUSTFLAGS="-D warnings" made
  # every build/test lane (G01-G06) fail on ordinary lint drift, which is
  # G07's job, and conflicted with RFC 093's rule that stable-only lint
  # drift may be fixed without touching MSRV. G07's own clippy invocation
  # already carries -D warnings explicitly.

jobs:
  # RFC 093 Gate Matrix v1 (A3.1). Each lane is checkout + the dispatcher;
  # the dispatcher (scripts/ci-gate.sh) owns the environment/evidence block
  # and executes the literal command recorded in ci/gate-inputs.toml's
  # [gates] table verbatim (decision D1). This replaces the former
  # build-test/fmt-clippy jobs, which G01-G09b strictly supersede (decision
  # D2) — MSRV and stable, default and all-features, plus G07b closing the
  # default-features clippy gap all-features-only G07 cannot see, plus LDAP
  # smoke. Caching is registry/git only, no target/ (decision D3): a gate
  # matrix exists to distinguish build configurations, so its evidence
  # should not depend on artifacts built under a different one.
  G01:
    name: "G01 — build (1.95, default)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.95"
      - name: Cache cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-gate-input-v1-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: G01
        run: bash scripts/ci-gate.sh G01

  G02:
    name: "G02 — test (1.95, default)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.95"
      - name: Cache cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-gate-input-v1-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: G02
        run: bash scripts/ci-gate.sh G02
        env:
          # Tests that bind sockets / clocks need a stable timezone.
          TZ: UTC

  G03:
    name: "G03 — build (1.95, all-features)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.95"
      - name: Cache cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-gate-input-v1-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: G03
        run: bash scripts/ci-gate.sh G03

  G04:
    name: "G04 — test (1.95, all-features)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.95"
      - name: Cache cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-gate-input-v1-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: G04
        run: bash scripts/ci-gate.sh G04
        env:
          TZ: UTC

  G05:
    name: "G05 — build + test (stable, default)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
      - name: Cache cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-gate-input-v1-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: G05
        run: bash scripts/ci-gate.sh G05
        env:
          TZ: UTC

  G06:
    name: "G06 — build + test (stable, all-features)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
      - name: Cache cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-gate-input-v1-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: G06
        run: bash scripts/ci-gate.sh G06
        env:
          TZ: UTC

  G07:
    name: "G07 — clippy (stable, all-features)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: clippy
      - name: Cache cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-gate-input-v1-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: G07
        run: bash scripts/ci-gate.sh G07

  G07b:
    name: "G07b — clippy (stable, default)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: clippy
      - name: Cache cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-gate-input-v1-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: G07b
        run: bash scripts/ci-gate.sh G07b

  G08:
    name: "G08 — fmt (stable)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt
      - name: G08
        run: bash scripts/ci-gate.sh G08

  G09a:
    name: "G09a — LDAP smoke (1.95)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.95"
      - name: Cache cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-gate-input-v1-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: G09a
        run: bash scripts/ci-gate.sh G09a

  G09b:
    name: "G09b — LDAP smoke (stable)"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
      - name: Cache cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-gate-input-v1-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: G09b
        run: bash scripts/ci-gate.sh G09b

  text-leaks:
    # RFC 048 (+ RFC 051 widening): Bare `t.field` identifiers as
    # `view!` macro children render as literal text in the HTML output
    # (Leptos treats anything outside `{…}` as a string literal).
    # Forty-eight such sites leaked through to production at v0.41.0;
    # an additional 15 in tags-without-attributes (e.g. `<h2>t.foo</h2>`)
    # leaked through the initial RFC 048 grep and were caught only at
    # v0.43.0. The widened pattern below catches both.
    name: text-leak invariants
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: No bare i18n expressions in view! children
        run: |
          set -e
          # Match `>t.foo<` regardless of what's before the opening `>`:
          # both `<h2>t.foo</h2>` (no-attr open tag) and
          # `<span class="x">t.foo</span>` (with-attr open tag) leak.
          # Identifiers may include digits (e.g. `settings_logs_recent_24h`).
          inline=$(grep -rEn '>t\.[a-z_0-9]+<' crates/ \
                     --include='*.rs' || true)
          if [ -n "$inline" ]; then
            echo "::error::Bare 't.field' identifier as view! macro child."
            echo "These render as literal text — wrap in {…}:"
            echo "$inline"
            exit 1
          fi
      - name: Advisory — standalone `t.foo` lines may also be view! leaks
        run: |
          # Standalone `    t.foo` on its own line MAY be a view! leak
          # (Leptos treats macro children outside `{}` as literal text)
          # OR may be a legitimate Rust expression — for example the
          # body of `if cond { t.foo } else { t.bar }`. We can't
          # distinguish statically without a Leptos-aware parser, so
          # this check is advisory: it surfaces candidates without
          # failing the build. Reviewers eyeball the output.
          standalone=$(grep -rEn '^\s+t\.[a-z_0-9]+\s*$' crates/ \
                         --include='*.rs' || true)
          if [ -n "$standalone" ]; then
            echo "::warning::Standalone 't.field' lines — verify whether each is inside view! macro:"
            echo "$standalone"
          fi

  css-tokens:
    # RFC 049: Every `var(--…)` reference must resolve against a
    # token declared in tokens.rs or components.rs. Browsers silently
    # drop declarations referencing undefined variables, so a typoed
    # token name breaks visual styling without any compile error.
    # v0.41.0 had seven such typos.
    name: CSS tokens resolve
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: All var(--…) references resolve
        run: |
          set -e
          # 1. Declared variables: lines like  `  --name: value;`
          declared=$(grep -hoE '^\s+--[a-z0-9-]+\s*:' \
                       crates/sui-id-web/src/tokens.rs \
                       crates/sui-id-web/src/components.rs \
                     | sed 's/^[[:space:]]*//; s/[[:space:]]*:.*$//' \
                     | sort -u)
          # 2. Used variables: any var(--name) anywhere in the crates.
          used=$(grep -rhoE 'var\(--[a-z0-9-]+' crates/ \
                   --include='*.rs' --include='*.css' \
                 | sed 's/^var(//' \
                 | sort -u)
          # 3. Used minus declared.
          unresolved=$(comm -23 <(echo "$used") <(echo "$declared"))
          if [ -n "$unresolved" ]; then
            echo "::error::CSS variable used but not declared:"
            echo "$unresolved"
            exit 1
          fi
      - name: Report unused tokens (advisory)
        run: |
          declared=$(grep -hoE '^\s+--[a-z0-9-]+\s*:' \
                       crates/sui-id-web/src/tokens.rs \
                       crates/sui-id-web/src/components.rs \
                     | sed 's/^[[:space:]]*//; s/[[:space:]]*:.*$//' \
                     | sort -u)
          used=$(grep -rhoE 'var\(--[a-z0-9-]+' crates/ \
                   --include='*.rs' --include='*.css' \
                 | sed 's/^var(//' \
                 | sort -u)
          unused=$(comm -13 <(echo "$used") <(echo "$declared") || true)
          if [ -n "$unused" ]; then
            echo "::warning::Declared tokens with no references:"
            echo "$unused"
          fi

  semantic-palette-parity:
    # RFC 061: every semantic colour (danger / warning / success / info)
    # has a triple {-default, -subtle, fg-on-} declared in BOTH the
    # light :root and the dark [data-theme="dark"] root of tokens.rs.
    # A v0.44.0 regression shipped because `--success-subtle` was used
    # by `.banner--success` in components.rs but never declared in
    # tokens.rs. The existing css-tokens job catches the
    # used-but-undeclared case; this job catches the structural
    # incompleteness that produced it.
    name: Semantic palette light/dark parity
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Semantic triples are paired light + dark
        run: |
          set -e
          tokens=crates/sui-id-web/src/tokens.rs
          # The four semantic families.
          for semantic in danger warning success info; do
            for slot in default subtle fg-on; do
              # fg-on takes the form "fg-on-{semantic}", others take
              # the form "{semantic}-{slot}". Build the canonical name.
              if [ "$slot" = "fg-on" ]; then
                name="fg-on-$semantic"
              else
                name="$semantic-$slot"
              fi
              # Count declarations across the file.
              count=$(grep -cE "^\s+--${name}\s*:" "$tokens" || true)
              # Expect declarations in: light :root + dark
              # [data-theme="dark"] + dark @media auto. = 3.
              # If less, the token is missing in at least one mode.
              if [ "$count" -lt 3 ]; then
                echo "::error::--${name} declared only ${count} time(s); expected 3 (light :root + [data-theme=\"dark\"] + @media auto)"
                exit 1
              fi
            done
          done
          echo "All 12 semantic tokens (4 families × 3 slots) declared in all 3 mode roots."

  inline-style-bound:
    # RFC 067 (v0.48.0): bound the inline `style=""` attribute count
    # in `pages/`. Encourages adding a utility class in
    # components.rs over reaching for an inline style. The threshold
    # of 20 leaves a small headroom for genuinely-one-off styles
    # (truly dynamic content, page tweaks like opacity:0.85).
    name: Inline style attribute count in pages/
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Count inline style attributes in pages/
        run: |
          set -e
          count=$(grep -rEohn 'style="[^"]*"' \
                    crates/sui-id-web/src/pages/ \
                    --include='*.rs' | wc -l)
          echo "Inline style count in pages/: $count"
          if [ "$count" -gt 20 ]; then
            echo "::error::Inline 'style=' count ($count) exceeds bound (20)."
            echo "Suggest a utility class in components.rs or document"
            echo "why the inline style is necessary."
            exit 1
          fi

  ui-invariants-v1:
    # RFC 093 G12 consolidated entry point. Keep the four legacy jobs above
    # until this integration receives independent review and hosted evidence.
    name: G12 UI invariants v1
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Record gate environment
        run: |
          set -euo pipefail
          checked_out_sha=$(git rev-parse HEAD)
          echo "event_commit=$GITHUB_SHA"
          echo "checked_out_commit=$checked_out_sha"
          if [[ "$checked_out_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Checked-out HEAD does not match GITHUB_SHA"
            exit 1
          fi
          test -z "$(git status --porcelain)"
          echo "runner_image=${ImageOS:-unknown} ${ImageVersion:-unknown}"
          bash_path=$(command -v bash)
          echo "bash_path=$bash_path"
          test "$bash_path" = /usr/bin/bash
          /usr/bin/bash --version | head -n 1
          bash_major=${BASH_VERSINFO[0]}
          bash_minor=${BASH_VERSINFO[1]}
          if ((bash_major != 5 || bash_minor < 2)); then
            echo "::error::G12 requires Bash >=5.2,<6"
            exit 1
          fi
      - name: G12 negative self-tests
        run: |
          set +e
          echo "command=bash scripts/tests/check-ui-invariants-fixtures.sh"
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          bash scripts/tests/check-ui-invariants-fixtures.sh
          status=$?
          echo "exit_status=$status"
          echo "ended_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          exit "$status"
      - name: G12 blocking gate
        run: |
          set +e
          echo "command=bash scripts/check-ui-invariants.sh --all --policy ci/ui-invariants.toml"
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          bash scripts/check-ui-invariants.sh --all --policy ci/ui-invariants.toml
          status=$?
          echo "exit_status=$status"
          echo "ended_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          exit "$status"

  gate-inputs:
    # RFC 093 A3.4: ci/gate-inputs.toml enforcement. Verifies the manifest
    # scripts/ci-gate.sh reads is itself correct — action pinning, the
    # [rust_components]/[gates] tables, version fields, runner labels, and
    # (condition 7) that [gates] matches RFC 093's Gate Matrix v1 table
    # exactly — so the dispatcher's "runs the matrix command" property is a
    # checked invariant, not a convention.
    name: A3.4 gate-inputs.toml enforcement
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Record gate environment
        run: |
          set -euo pipefail
          checked_out_sha=$(git rev-parse HEAD)
          echo "event_commit=$GITHUB_SHA"
          echo "checked_out_commit=$checked_out_sha"
          if [[ "$checked_out_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Checked-out HEAD does not match GITHUB_SHA"
            exit 1
          fi
          test -z "$(git status --porcelain)"
          echo "runner_image=${ImageOS:-unknown} ${ImageVersion:-unknown}"
      - name: gate-inputs negative self-tests
        run: |
          set +e
          echo "command=bash scripts/tests/check-gate-inputs-fixtures.sh"
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          bash scripts/tests/check-gate-inputs-fixtures.sh
          status=$?
          echo "exit_status=$status"
          echo "ended_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          exit "$status"
      - name: gate-inputs blocking check
        run: |
          set +e
          echo "command=bash scripts/check-gate-inputs.sh --all --policy ci/gate-inputs.toml"
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          bash scripts/check-gate-inputs.sh --all --policy ci/gate-inputs.toml
          status=$?
          echo "exit_status=$status"
          echo "ended_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          exit "$status"

  gate-matrix-fixtures:
    # RFC 093 A3.2: negative self-tests for the Gate Matrix v1 lane commands
    # themselves (scripts/tests/fixtures/gate-matrix/) and for
    # scripts/ci-gate.sh's own evidence-contract preconditions. Unlike
    # ui-invariants-v1/gate-inputs above, there is no separate "blocking
    # check against the real repository" step here: the G01-G09b jobs
    # already are that check against the real repository. This job only
    # proves the fixtures fail (or pass) exactly as each lane's command
    # requires.
    name: A3.2 gate-matrix negative self-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Record gate environment
        run: |
          set -euo pipefail
          checked_out_sha=$(git rev-parse HEAD)
          echo "event_commit=$GITHUB_SHA"
          echo "checked_out_commit=$checked_out_sha"
          if [[ "$checked_out_sha" != "$GITHUB_SHA" ]]; then
            echo "::error::Checked-out HEAD does not match GITHUB_SHA"
            exit 1
          fi
          test -z "$(git status --porcelain)"
          echo "runner_image=${ImageOS:-unknown} ${ImageVersion:-unknown}"
      - name: Install Rust 1.95
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.95"
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Cache cargo registry
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-gate-input-v1-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install mdBook 0.5.4
        # ci/gate-inputs.toml's [tools] table already pins this version for
        # G10a; installing it from crates.io needs no new SHA-pinned action.
        run: cargo install mdbook --version 0.5.4 --locked
      - name: gate-matrix negative self-tests (G01-G08, G07b)
        run: |
          set +e
          echo "command=bash scripts/tests/check-gate-matrix-fixtures.sh"
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          bash scripts/tests/check-gate-matrix-fixtures.sh
          status=$?
          echo "exit_status=$status"
          echo "ended_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          exit "$status"
      - name: ci-gate evidence-contract self-tests
        run: |
          set +e
          echo "command=bash scripts/tests/check-ci-gate-fixtures.sh"
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          bash scripts/tests/check-ci-gate-fixtures.sh
          status=$?
          echo "exit_status=$status"
          echo "ended_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          exit "$status"
      - name: G10a self-test (mdbook-missing-chapter must fail)
        run: |
          set +e
          echo "command=mdbook build scripts/tests/fixtures/mdbook-missing-chapter"
          echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mdbook build scripts/tests/fixtures/mdbook-missing-chapter
          status=$?
          echo "exit_status=$status"
          echo "ended_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          if [[ "$status" -eq 0 ]]; then
            echo "::error::G10a self-test: mdbook-missing-chapter fixture unexpectedly succeeded"
            exit 1
          fi
          echo "G10a self-test: expected failure observed"
