name: Fuzz

# Manual only: a weekly schedule failed eight consecutive weeks unnoticed
# (situation-fit audit, 2026-08-26) -- a cron in a solo repo has no
# subscriber for a red run. Run before a release instead.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Number of fuzz iterations per target (default: 100000)"
        required: false
        default: "100000"
      proptest_cases:
        description: "PROPTEST_CASES for the wide proptest run (default: 65536)"
        required: false
        default: "65536"

jobs:
  fuzz-run:
    name: Fuzz run (manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: accept_language
            features: ""
          - target: ids_fromstr
            features: ""
          # core-targets: pull sui-id-core (webauthn-rs -> openssl), hence
          # libssl-dev below. accept_language/ids_fromstr stay openssl-free.
          - target: pkce_verify
            features: "--features core-targets"
          - target: authorize_params
            features: "--features core-targets"
          - target: jwt_parse
            features: "--features core-targets"
          - target: logout_params
            features: "--features core-targets"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Accumulate pattern: every run restores the newest prior corpus for
      # this target and saves a fresh entry, so coverage compounds instead
      # of resetting each dispatch (fuzz-corpus-persistence handoff).
      - name: Restore fuzz corpus
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: |
            fuzz-corpus-${{ matrix.target }}-
      - uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2
        with:
          toolchain: nightly
      - name: Install libssl-dev (core-dependent fuzz targets)
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Seed corpus with curated starting inputs
        working-directory: fuzz
        run: |
          mkdir -p corpus/${{ matrix.target }}
          cp -n seeds/${{ matrix.target }}/* corpus/${{ matrix.target }}/ 2>/dev/null || true
      - name: Run fuzz target ${{ matrix.target }}
        working-directory: fuzz
        env:
          RUNS: ${{ github.event.inputs.runs || '100000' }}
        run: |
          cargo fuzz run ${{ matrix.target }} ${{ matrix.features }} -- \
            -runs=$RUNS \
            -max_len=512 \
            -timeout=10
      - name: Upload corpus artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/

  proptest-wide:
    # RFC 132 D6: the narrow per-push case caps (256-512 for the cheap
    # properties, 4 for Argon2) exist for speed. A wide run reaches inputs
    # the narrow run cannot; when it finds a counterexample, proptest writes
    # a regression file, that file is committed, and the counterexample
    # becomes a permanent case in the fast suite forever -- so this is a
    # generator of narrow-suite cases, not a parallel test suite. Manual
    # only, before a release, for the same reason the fuzz job above is:
    # a scheduled run that can fail on a newly generated input has no
    # subscriber for a red run in a solo repo (see the comment at the top
    # of this file). Not a gate: nondeterministic by design, the opposite
    # of what `[gates]` is for.
    name: Wide proptest run (manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: "1.95"
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config
      - name: Run the workspace suite with widened proptest case counts
        env:
          PROPTEST_CASES: ${{ github.event.inputs.proptest_cases || '65536' }}
        run: cargo test --workspace
