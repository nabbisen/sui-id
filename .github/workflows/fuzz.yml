name: Fuzz

# Manual only: a weekly schedule failed eight consecutive weeks unnoticed
# (situation-fit audit, 2026-08-26) -- a cron in a solo repo has no
# subscriber for a red run. Run before a release instead.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Number of fuzz iterations per target (default: 100000)"
        required: false
        default: "100000"

jobs:
  fuzz-run:
    name: Fuzz run (manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        target:
          - accept_language
          - ids_fromstr
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Run fuzz target ${{ matrix.target }}
        working-directory: fuzz
        env:
          RUNS: ${{ github.event.inputs.runs || '100000' }}
        run: |
          cargo fuzz run ${{ matrix.target }} -- \
            -runs=$RUNS \
            -max_len=512 \
            -timeout=10
      - name: Upload corpus artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
