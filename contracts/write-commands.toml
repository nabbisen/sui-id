[[command]]
id = "C17"
class = "A"
status = "implemented"  # implemented | target-absent | target-legacy
sealed = true
owner = "Federation-provider enable/disable"
rationale = "RFC 096-B2 S4: `federation.provider.enabled`/`federation.provider.disabled`, one command with two event variants (the contract's own `owner` field above, set at stage 2a, already named both halves as one unit). Enable consumes a `ValidatedProviderPreflight` capability (RFC 096 `:409-446`, the C17-seam amendment): `sui_id::federation_preflight::check_and_enable` is its one legitimate caller (the source-scope test, `crates/sui-id/tests/e2e/r096_b2_stage4_c17_scope.rs`, is what makes that more than a comment), runs `BEGIN IMMEDIATE` so `guard_at` is read only after the write lock is actually held (`Database::with_tx_immediate`/`class_a_immediate` -- the only command that opens this mode; every other command keeps `with_tx`/`class_a` DEFERRED, unchanged), rechecks disabled/version/generation/digest from the stored row rather than trusting the capability alone, and checked-increments `activation_generation`. Disable requires a currently enabled row, checked-increments the generation, clears every `evidence_*` column, and invalidates flows (S2b's `invalidate_provider_flows_within_tx`) -- `validation_status` is left exactly as it is (RFC 096-B2 S4 §B), unlike C25's config-removal disable."
mutation_surface = "`federation_provider::get_within_tx`, `federation_provider::enable_from_preflight_within_tx` (enable) / `federation_provider::disable_within_tx` (disable), and, for disable, the shared per-provider flow invalidation (`commands::invalidate_provider_flows_within_tx`) -- via `commands::enable_federation_provider_from_preflight` (through `Database::class_a_immediate`/`backend::with_tx_immediate_erased`, `BEGIN IMMEDIATE`) and `commands::disable_federation_provider` (through the ordinary `Database::class_a`, DEFERRED)"
files = ["crates/sui-id-store/src/backend.rs", "crates/sui-id-store/src/db.rs", "crates/sui-id-store/src/registry.rs", "crates/sui-id-store/src/repos/federation_provider.rs", "crates/sui-id-store/src/commands.rs", "crates/sui-id/src/http/federation_preflight.rs"]
