rationale = "cycle J stage 10, R2: the adversarial assessment's own finding -- `oauth_token::revoke` calls `try_revoke_access` (T07's `revoked_access_tokens::insert`, via `deny_list::insert`) and `try_revoke_refresh` (T06's `refresh_tokens::revoke`), and no row owned that path; T06/T07's own `subordinate to` lists omitted it. Class **P**, the same shape F05 already uses: a real, client-triggered action whose own audit event (`token.revoke`) is Class B by RFC 094 invariant 5's own rule for revocations -- sealing it Class A (`db.class_a`) would make the revocation itself depend on the audit write succeeding, which invariant 5 forbids. `token.revoke`'s best-effort append is R1's own site (`handlers/oauth_token.rs:144`), now `emit_must_attempt`; this row is the mutation that append describes, not the append itself."
