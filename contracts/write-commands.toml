rationale = "`admin.master_key.resealed`, not attribute-free -- carries the per-table re-seal counts as attributes. CLI-only (`sui-id admin rotate-key`); the operator's authority is possession of the master key and filesystem access, not an authenticated user, so `system_principal: permitted`, actor none -- the shape U08, C22 and S05 use. RFC 094 cycle J stage 4, closing M2b criterion 2: moved from the bare, downstream `sui_id_core::oidc::key_rotation::rotate_master_key`, which could not be sealed in place (`declare_write_command!` is defined in this crate, not `sui-id-core`). Distinct from `admin.master_key.rotated`, unchanged by this stage -- that event fires after the key file is replaced, best-effort, outside any transaction, and is not this row."
mutation_surface = "`signing_keys::reseal_all`, `refresh_tokens::reseal_all`, `user_totp::reseal_all`, `user_webauthn_credentials::reseal_all`, `smtp_config::reseal_all`, `email_outbox::reseal_all` (via `commands::reseal_master_key`)"
files = ["crates/sui-id-store/src/repos/signing_keys.rs", "crates/sui-id-store/src/repos/refresh_tokens.rs", "crates/sui-id-store/src/repos/user_totp.rs", "crates/sui-id-store/src/repos/user_webauthn_credentials.rs", "crates/sui-id-store/src/repos/smtp_config.rs", "crates/sui-id-store/src/repos/email_outbox.rs"]
test_id = "`k07_reseal_master_key_appends_exactly_one_audit_row`"
event = ["admin.master_key.resealed"]
descriptor = ["K07_RESEALED"]

