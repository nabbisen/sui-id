# The durable-write command inventory (RFC 094 Stage 0), and the only copy of it:
# rfcs/handoffs/094-transactional-audit/command-inventory.md keeps the reasoning
# and no table (RFC 116 D1). `cargo xtask audit-structure` (lane G23; RFC 116
# stage 1's interim `scripts/check-write-commands.py`, lane G17, retired RFC 094
# cycle J stage 6b) reads this file against crates/ on every run; it is a
# contract because that gate fails when it stops being true (RFC 116 D2).
#
# A row is one command. Two states, because the inventory records commands that
# are planned as well as commands that are sealed (RFC 116 D2a):
#   sealed = true   the command is declared with `declare_write_command!`. The
#                   gate requires it to exist, and requires `event` and
#                   `descriptor` to be exactly what the code maps it to.
#   sealed = false  planned. No command by this id may be declared, and the row
#                   carries no `event` or `descriptor`.
# And every command the code declares has a row saying `sealed = true`.
#
# `event` lists the audit event names the command can emit; `descriptor` lists
# the `EventDescriptor` statics they come from. Both are derived, never written
# by hand: `python3.14 scripts/check-write-commands.py --root . --inventory
# contracts/write-commands.toml --fix` rewrites them from the code.
#
# `status` says what the row's `files` are:
#   implemented    code exists and implements what the row describes
#   target-absent  no implementation exists yet; `files` is empty
#   target-legacy  code exists, but it is what this row will replace, not an
#                  implementation of it
# Every path in `files` exists, and only a `target-absent` row may name none.
#
# There is no count in this header on purpose. The gate prints the counts it
# derives from the rows; a number written here is how this file went stale.
#
# U06 (admin password reset) has no row: RFC 103 D1 retired it, and U37 replaced
# it. The retirement is recorded in command-inventory.md.
#
# F01 (existing federation link, no local MFA) has no row: RFC 094 `:548`'s
# F01-class amendment (2026-10-15) folded it into L04, so it is no longer a
# separately `declare_write_command!`-declared command for a row to describe --
# its own mutation surface now runs inside L04's own transaction. The
# retirement is recorded in command-inventory.md.
#
# C12 (create authorization-scope definition) and C13 (delete authorization-
# scope definition) have no rows, removed cycle I stage 5 (2026-10-31):
# `scope_definition::create` and `scope_definition::delete` had no caller
# anywhere in `crates/`, and no proposed or accepted RFC plans scope-catalog
# administration. The retirement is recorded in command-inventory.md.
#
# C24 (federation-provider allowed-origins reconcile) has no row: RFC 096-B2
# S2b (2026-11-11), RFC 096 amendment A4 (corrected 2026-11-11), folded it
# into C23 -- `allowed_origins` is trust policy like every other field C23
# now covers, not a write of its own. `federation_provider::
# update_allowed_origins`/`update_allowed_origins_within_tx` and
# `commands::update_federation_provider_allowed_origins` are deleted, no
# caller left anywhere in `crates/`. The retirement is recorded in
# command-inventory.md.

