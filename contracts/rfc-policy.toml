version = 1

# RFC 093 RFC-integrity contract, invariant 7: RFC-MI-* identifiers that
# predate the current metadata regime. Any MI identifier not listed here
# is prospective and requires the full current metadata field set
# (scripts/check-rfc-integrity.py's "required_metadata_fields", below)
# regardless of folder. This list is closed: a new MI RFC never gets
# added here, it gets the full metadata fields instead.
[historical_rfc_mi]
ids = [
  "RFC-MI-000",
  "RFC-MI-010",
  "RFC-MI-011",
  "RFC-MI-012",
  "RFC-MI-020",
  "RFC-MI-021",
  "RFC-MI-022",
  "RFC-MI-030",
  "RFC-MI-031",
  "RFC-MI-040",
  "RFC-MI-041",
  "RFC-MI-050",
  "RFC-MI-051",
  "RFC-MI-060",
  "RFC-MI-070",
  "RFC-MI-080",
]

# Standard numeric RFCs at or above this identifier require the full
# current metadata field set regardless of folder or git history
# (invariant 6). Below it, only structural checks (numbering, folder/
# status agreement, index, links) apply (invariant 11).
[metadata_required_from]
min_number = 93

# RFC 110 (G11 condition 15): a header in proposed/, accepted/ or done/ may not
# cite an archived RFC as authority. This table is the closed list of
# exceptions: RFC number -> the archived RFC numbers its header may name. It is
# a policy entry, not a lexical marker in the header, so an author cannot write
# their own exemption: adding a line here is a visible edit to a reviewed file.
# `Supersedes [RFC 007]` is the one legitimate case (a supersession names what
# it replaces); the RFC 007 it names is `rfcs/archive/007-multi-tenancy.md`.
[archive_citations]
"025" = ["007"]
# RFC 135 supersedes RFC 117 and its header must name it: a supersession
# that cannot cite what it supersedes records nothing. The archived RFC is
# named as the thing replaced, not relied on as authority.
"135" = ["117"]

# RFC 133 D2 (G11 condition 9c): an Independent design review field must cite
# at least one review filed under this RFC's own handoffs/<N>-slug/
# directory. This is the closed list of exceptions -- a genuine review
# shared by more than one RFC. Adding an entry is a reviewable act: it is
# declared in the package that adds it, names the shared review, and every
# entry requires a non-empty `reason` (checked at startup; a blank one is a
# policy error, the same rule contracts/contract-paths.toml already applies).
# Simulated against the whole tree on 2026-10-02: these three are the only
# RFCs whose field cites no review under their own handoff directory.
[[review_subject_allowlist]]
rfc = "095"
shares_with = "094"
reason = "one correction review measured 094, 095 and 096 together after the 2026-08-26 re-acceptance (rfcs/handoffs/094-transactional-audit/094-095-096-correction-review-2026-08-26.md); splitting it into three near-identical files would be worse evidence, not better"

[[review_subject_allowlist]]
rfc = "096"
shares_with = "094"
reason = "same shared review as 095 above: the 2026-08-26 correction review covers 094, 095 and 096 together, filed under 094's handoff directory"

[[review_subject_allowlist]]
rfc = "103"
shares_with = "102"
reason = "102 and 103 share one design review (rfcs/handoffs/102-authentication-fails-closed/102-103-design-review-2026-09-16.md), filed under 102's handoff directory because the two were accepted together"
