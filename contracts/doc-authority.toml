# RFC 098 G15 policy. D3: a machine-consumed contract, holding the freshness
# tolerance, the list of version-pinned documents and the event-reference
# pair, and nothing else. The gate that reads it is the only thing that makes
# it true.
version = 1

[freshness]
# "current as of" may lag the workspace by at most this many minor versions.
# A starting value for `@nabbisen` to adjust: it is chosen, not derived.
tolerance_minor = 2
# RFC 098 rule 5: a banner is the sanctioned state for a lagging document,
# so a bannered document passes however far behind it is.
banner_regex = '^> \*\*Stale as of'
banner_within_lines = 40
claim_regex = 'current as of \*\*?v(\d+\.\d+\.\d+)|reflecting the v(\d+\.\d+\.\d+) codebase'
documents = ["docs/threat-model.md", "docs/development-specification.md"]

[event_reference]
# Check (D): the reader reference lists exactly the events the matrix
# registers. The matrix is the gated copy (G23 checks it against the code,
# authoritative since RFC 094 cycle J stage 7; G13 still checks it too, for
# vocabulary-drift diagnosis); the reference follows it.
matrix = "contracts/audit-coverage-matrix.md"
reference = "docs/src/reference/audit-events.md"
