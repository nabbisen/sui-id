[workspace]
resolver = "3"
members = [
    "crates/sui-id",
    "crates/sui-id-core",
    "crates/sui-id-store",
    "crates/sui-id-web",
    "crates/sui-id-shared",
    "crates/sui-id-i18n",
]
# RFC 093 A3.2: Gate Matrix negative fixtures are deliberately broken
# standalone packages (scripts/tests/fixtures/gate-matrix/). Excluding the
# directory keeps them out of this workspace so `cargo ... --workspace`,
# which scripts/ci-gate.sh runs verbatim per fixture, resolves to the single
# fixture it is invoked in rather than pulling in its siblings or this
# workspace.
exclude = ["scripts/tests/fixtures"]

[workspace.package]
version = "0.77.0"
edition                 = "2024"
rust-version            = "1.95"
license                 = "Apache-2.0"
authors                 = ["nabbisen"]
repository              = "https://github.com/nabbisen/sui-id"
homepage                = "https://github.com/nabbisen/sui-id"
documentation           = "https://docs.rs/sui-id"
categories              = ["authentication", "web-programming::http-server"]
keywords                = ["oidc", "oauth2", "idaas", "identity", "authentication"]
readme                  = "README.md"

[workspace.dependencies]
sui-id-core                 = { version = "0.77.0", path = "crates/sui-id-core" }
sui-id-i18n                 = { version = "0.77.0", path = "crates/sui-id-i18n" }
sui-id-shared               = { version = "0.77.0", path = "crates/sui-id-shared" }
sui-id-store                = { version = "0.77.0", path = "crates/sui-id-store" }
sui-id-web                  = { version = "0.77.0", path = "crates/sui-id-web" }

# Async runtime / web
tokio                       = { version = "1.40", features = ["macros", "rt-multi-thread", "signal", "fs", "sync", "time"] }
axum                        = { version = "0.8", features = ["macros"] }
axum-extra                  = { version = "0.12", features = ["cookie"] }
tower                       = "0.5"
tower-http                  = { version = "0.7", features = ["trace", "compression-gzip", "set-header"] }
cookie                      = "0.18"

# Serde / config
serde                       = { version = "1", features = ["derive"] }
serde_json                  = "1"
toml                        = "1.1"

# Storage
rusqlite                    = { version = "0.40", features = ["bundled", "chrono"] }

# Crypto / hashing
argon2                      = "0.5"
getrandom                   = "0.4"
rand                        = "0.10"
rand_core                   = { version = "0.10" }
chacha20poly1305            = "0.11"
ed25519-dalek               = { version = "2.1", features = ["rand_core", "pkcs8"] }
sha2                        = "0.11"
sha1                        = { version = "0.11", default-features = false }
qrcode                      = { version = "0.14", default-features = false, features = ["svg"] }
# WebAuthn / passkey support. We use the high-level safe wrapper from
# webauthn-rs; the lower-level webauthn-rs-core has explicit warnings
# in its docs not to use it directly. Pinned to 0.5.x.
#
# `danger-allow-state-serialisation` lets us serialise the in-flight
# `PasskeyRegistration` / `PasskeyAuthentication` ceremony state to the
# `webauthn_pending` table. The "danger" prefix signals: do not let this
# state escape the trust boundary. We never expose it over the wire —
# it stays on the server, behind the master key boundary like any other
# row.
webauthn-rs                 = { version = "0.5", features = ["danger-allow-state-serialisation"] }
# Property-based testing. Dev-only — never reaches production builds.
proptest                    = "1.5"
hmac                        = "0.13"
subtle                      = "2.6"
prometheus                  = { version = "0.14", default-features = false }
ldap3                       = { version = "0.12", default-features = false, features = ["tls-rustls-ring"] }
zeroize                     = { version = "1.8", features = ["derive"] }
secrecy                     = { version = "0.10", features = ["serde"] }
base64ct                    = { version = "1.6", features = ["alloc"] }

# Logging / errors
tracing                     = "0.1"
tracing-subscriber          = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-appender            = "0.2"
thiserror                   = "2"
anyhow                      = "1"

# Misc
uuid                        = { version = "1.10", features = ["v4", "serde"] }
chrono                      = { version = "0.4", features = ["serde"] }
url                         = { version = "2.5", features = ["serde"] }
percent-encoding            = "2.3"
time                        = "0.3"

# Email — wasm-smtp v0.15 family.
# - core (`wasm-smtp`) drives the SMTP state machine, message parsing and
#   error classification, and is runtime-agnostic. We enable `mail-builder`
#   so `SmtpClient::send_message` accepts a `mail_builder::MessageBuilder`
#   directly (the alternative is hand-rolling RFC 5322 + MIME boundaries).
# - The tokio adapter (`wasm-smtp-tokio`) wires the core crate up to a
#   native tokio + rustls socket. Default features:
#   - `native-roots` — system trust store (works in our container; switch
#     to `webpki-roots` for distroless if needed)
#   - `aws-lc-rs` — default rustls crypto provider; no rustflags needed
#     for the native target (only the wasm32 target needs the special
#     `getrandom_backend="wasm_js"` cfg).
# - `mail-builder` is a small, no-required-deps RFC 5322 / MIME composer
#   from Stalwart Labs. `wasm-smtp`'s docs explicitly recommend it.
wasm-smtp                   = { version = "0.15", features = ["mail-builder"] }
wasm-smtp-tokio             = "0.15"
mail-builder                = "0.4"

# Outbound HTTP — used for the optional Pwned Passwords (HIBP)
# breach check. reqwest (async, rustls) replaces the former ureq
# (sync, spawn_blocking) after RFC 070 (v0.57.1). The HIBP handler
# is now a plain async fn; reqwest::Client is stored in AppState.
async-trait                 = "0.1"
reqwest                     = { version = "0.13", default-features = false, features = ["rustls", "json", "form"] }
# Direct dependency (not just transitive via reqwest/ldap3) so startup can
# call CryptoProvider::install_default() exactly once, process-wide, before
# any TLS-capable code runs (LDAPS via ldap3, implicit-TLS SMTP via
# wasm-smtp-tokio, and reqwest's federation/HIBP client). Both provider
# backends are already compiled into the binary transitively — `ring` via
# ldap3's tls-rustls-ring, `aws_lc_rs` via reqwest's rustls integration,
# which prefers an installed global default and only falls back to its own
# aws_lc_rs default when none exists — so this is ambiguous without an
# explicit install (RFC 093 G09's "provider panic"). Both features are
# listed explicitly here rather than left to transitive unification, since
# which one startup actually installs (aws_lc_rs, matching reqwest's
# default — see runtime::startup::install_rustls_crypto_provider) is a
# deliberate choice, not an accident of dependency resolution.
rustls                       = { version = "0.23", default-features = false, features = ["ring", "aws_lc_rs"] }

# UI (Leptos used in SSR-only mode for the admin panel; no WASM/JS bundle is shipped
#  in line with the project's minimal-runtime philosophy).
leptos                      = { version = "0.8", default-features = false, features = ["ssr"] }

# Asset embedding
include_dir                 = "0.7"

# Test helpers
tempfile                    = "3.13"

[workspace.lints.rust]
unsafe_code     = "forbid"
unused_must_use = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
unwrap_used     = "warn"
expect_used     = "warn"
panic           = "warn"
todo            = "warn"
unimplemented   = "warn"

[profile.release]
opt-level       = 3
lto             = "thin"
codegen-units   = 1
strip           = "symbols"
panic           = "abort"

[profile.dev]
opt-level       = 0
