# ─── DO NOT REMOVE THE [workspace] TABLE BELOW ───────────────────────────────
#
# It looks empty. It is load-bearing.
#
# This table is what makes fuzz/ a workspace root of its own, separate from the
# repository root workspace. Without it, cargo refuses to build anything here:
#
#     error: current package believes it's in a workspace when it's not
#
# and `cargo fuzz` fails before a single target compiles.
#
# Why the separation exists (see also fuzz/README.md and
# fuzz/rust-toolchain.toml): cargo-fuzz needs nightly for -Zsanitizer, while the
# main workspace is pinned to the stable MSRV. Keeping fuzz/ outside the root
# workspace is what lets the two coexist. fuzz/Cargo.lock is this workspace's
# own lock file for the same reason.
#
# This table was deleted once, on 2026-07-02 in commit 901e651 ("Workspace
# dependency consolidation, housekeeping"), as apparent clutter. Nothing in that
# commit needed it gone -- the dependencies below are still explicit paths and
# versions, not workspace inheritance. The scheduled Fuzz workflow then failed
# at build on every run for eight weeks, from 2026-07-06 to 2026-08-24, and was
# noticed only because an unrelated audit read the run list.
#
# If you are tidying this file and this section looks like leftover noise:
# it is not. Removing it silently disables all fuzzing.
# ─────────────────────────────────────────────────────────────────────────────
[workspace]

[package]
name    = "sui-id-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

# cargo-fuzz metadata — marks this as a fuzz workspace
[package.metadata]
cargo-fuzz  = true

[features]
# Enable fuzz targets that depend on sui-id-core (requires libssl-dev).
core-targets = ["dep:sui-id-core"]

# Fuzz targets — each is a separate binary.

[[bin]]
name    = "accept_language"
path    = "fuzz_targets/accept_language.rs"
test    = false
doc     = false
bench   = false

[[bin]]
name    = "ids_fromstr"
path    = "fuzz_targets/ids_fromstr.rs"
test    = false
doc     = false
bench   = false

[[bin]]
name    = "pkce_verify"
path    = "fuzz_targets/pkce_verify.rs"
test    = false
doc     = false
bench   = false

[[bin]]
name    = "authorize_params"
path    = "fuzz_targets/authorize_params.rs"
test    = false
doc     = false
bench   = false

[[bin]]
name    = "jwt_parse"
path    = "fuzz_targets/jwt_parse.rs"
test    = false
doc     = false
bench   = false

[[bin]]
name     = "logout_params"
path     = "fuzz_targets/logout_params.rs"
test     = false
doc      = false
bench    = false

[dependencies]
# Crates that don't pull openssl (safe to depend on in this workspace):
sui-id-shared               = { path = "../crates/sui-id-shared" }
sui-id-i18n                 = { path = "../crates/sui-id-i18n" }
# sui-id-core pulls webauthn-rs → openssl. It is optional so that
# the openssl-free targets (accept_language, ids_fromstr) build in
# environments without libssl-dev. Enable with --features core-targets.
sui-id-core                 = { path = "../crates/sui-id-core", optional = true }

arbitrary                   = { version = "1", features = ["derive"] }
# Additional deps for core-dependent targets (jwt_parse uses ed25519-dalek;
# pkce_verify recomputes SHA-256/base64url to check its own invariant).
ed25519-dalek               = { version = "2.1", features = ["rand_core", "pkcs8"] }
sha2                        = "0.11"
base64ct                    = { version = "1.6", features = ["alloc"] }

libfuzzer-sys               = "0.4"
serde_json                  = "1.0"
