[package]
name        = "sui-id-store"
description = "Persistence layer (SQLite + field-level encryption) for sui-id, a self-hosted Rust OIDC provider."
readme      = "README.md"
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
authors.workspace       = true
repository.workspace    = true
homepage.workspace      = true
categories.workspace    = true
keywords.workspace      = true

[features]
ldap = ["dep:ldap3"]

[dependencies]
sui-id-shared               = { workspace = true }

async-trait                 = { workspace = true }
prometheus                  = { workspace = true }
rusqlite                    = { workspace = true }
serde                       = { workspace = true }
serde_json                  = { workspace = true }
thiserror                   = { workspace = true }
tracing                     = { workspace = true }
chrono                      = { workspace = true }
uuid                        = { workspace = true }
secrecy                     = { workspace = true }
zeroize                     = { workspace = true }
chacha20poly1305            = { workspace = true }
rand                        = { workspace = true }
getrandom                   = { workspace = true }
base64ct                    = { workspace = true }
sha2                        = { workspace = true }
subtle                      = { workspace = true }
tokio                       = { workspace = true, features = ["rt"] }
ldap3                       = { workspace = true, optional = true }

[dev-dependencies]
proptest                    = { workspace = true }
tempfile                    = { workspace = true }
tokio                       = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time"] }
# Enable both crypto-provider backends here, not just `ring` (which is all
# ldap3's tls-rustls-ring pulls in for this crate alone). In the real
# sui-id binary, reqwest's rustls integration also compiles in aws-lc-rs,
# which makes the two backends ambiguous and requires an explicit
# CryptoProvider::install_default() call — rustls's single-provider
# auto-fallback does not apply. Without this, the ldap_smoke fixture below
# would not reproduce the panic it exists to catch.
rustls                      = { workspace = true, features = ["aws_lc_rs"] }

[lints]
workspace   = true
