[package]
name        = "sui-id-core"
description = "Authentication / authorization core (OIDC / OAuth2 + PKCE) for sui-id, a self-hosted Rust OIDC provider."
readme      = "README.md"
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
authors.workspace       = true
repository.workspace    = true
homepage.workspace      = true
categories.workspace    = true
keywords.workspace      = true

[features]
default           = []
# Exposes deterministic in-memory implementations of the
# `HibpClient` and `MailSender` traits so downstream test code
# (sui-id e2e) can inject them into the AppState.
test-support      = []

[dependencies]
sui-id-shared               = { workspace = true }
sui-id-store                = { workspace = true }
sui-id-i18n                 = { workspace = true }

serde                       = { workspace = true }
serde_json                  = { workspace = true }
thiserror                   = { workspace = true }
tracing                     = { workspace = true }
chrono                      = { workspace = true }
uuid                        = { workspace = true }
url                         = { workspace = true }
webauthn-rs                 = { workspace = true }

argon2                      = { workspace = true }
ed25519-dalek               = { workspace = true }
sha2                        = { workspace = true }
sha1                        = { workspace = true }
hmac                        = { workspace = true }
rand                        = { workspace = true }
getrandom                   = { workspace = true }
subtle                      = { workspace = true }
secrecy                     = { workspace = true }
zeroize                     = { workspace = true }
async-trait                 = { workspace = true }

base64ct                    = { workspace = true }
reqwest                     = { workspace = true }

# Email — see workspace dependency notes for rationale.
wasm-smtp                   = { workspace = true }
wasm-smtp-tokio             = { workspace = true }
mail-builder                = { workspace = true }
tokio                       = { workspace = true }

[dev-dependencies]
proptest                    = { workspace = true }
tempfile                    = { workspace = true }
tokio                       = { workspace = true, features = ["net"] }
rustls                      = { workspace = true, features = ["aws_lc_rs"] }
# RFC 094 M2b / cycle J stage 10: `test-support` exposes
# `federation_provider::set_enabled` as `pub` for this crate's own
# `authn::federated_mfa` tests, which flip a provider's `enabled` flag
# directly (no production caller exists for it -- see its own doc
# comment). The same feature `sui-id`'s own dev-dependencies enabled in
# RFC 142 stage 5, for the same cross-crate-test reason.
sui-id-store                = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
