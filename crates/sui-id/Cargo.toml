[package]
name        = "sui-id"
description = "Self-hosted, single-binary OpenID Connect provider in Rust. Install with `cargo install sui-id`."
readme      = "../../README.md"
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
authors.workspace       = true
repository.workspace    = true
homepage.workspace      = true
categories.workspace    = true
keywords.workspace      = true

# Restrict what gets uploaded to crates.io. `cargo publish` automatically
# resolves `readme = "../../README.md"` and copies the file into the
# package; we do not need to list it here.
include = [
    "src/**/*",
    "tests/**/*",
    "static/**/*",
    "Cargo.toml",
]

[features]
default = []
ldap    = ["sui-id-store/ldap"]
# RFC 096-A harness: the test-support federation client constructor
# (runtime::egress::build_federation_client_for_tests). Off by default; enabled
# only for tests by the dev-dependency below, so no release build has the seam.
test-support = []

[[bin]]
name = "sui-id"
path = "src/main.rs"

# Integration test binary. The single `e2e` binary aggregates every
# themed module under `tests/e2e/<theme>.rs` so they share helpers
# (`tests/e2e/common.rs`) and a single compile.
[[test]]
name = "e2e"
path = "tests/e2e/main.rs"

[lints]
workspace = true

[dependencies]
sui-id-shared               = { workspace = true }
sui-id-i18n                 = { workspace = true }
sui-id-store                = { workspace = true }
sui-id-core                 = { workspace = true }
sui-id-web                  = { workspace = true }

# RFC 134 D2: `features = ["net"]` declared explicitly because this crate
# now calls `tokio::net::lookup_host` directly -- `net` was already
# reachable through workspace feature unification (sui-id-core and
# sui-id-store each enable it), which is exactly the dependency the
# handoff's own fact 4 says not to rely on implicitly.
tokio                       = { workspace = true, features = ["net"] }
axum                        = { workspace = true }
axum-extra                  = { workspace = true }
tower-http                  = { workspace = true }
time                        = { workspace = true }
cookie                      = { workspace = true }

serde                       = { workspace = true }
serde_json                  = { workspace = true }
toml                        = { workspace = true }
thiserror                   = { workspace = true }
anyhow                      = { workspace = true }
tracing                     = { workspace = true }
tracing-subscriber          = { workspace = true }
tracing-appender            = { workspace = true }
chrono                      = { workspace = true }
uuid                        = { workspace = true }
url                         = { workspace = true }
secrecy                     = { workspace = true }
rand                        = { workspace = true }
getrandom                   = { workspace = true }
prometheus                  = { workspace = true }
zeroize                     = { workspace = true }
base64ct                    = { workspace = true }
jsonwebtoken                = { workspace = true }
reqwest                     = { workspace = true }
rustls                      = { workspace = true }
# RFC 134 D5 Tier 3 (steps 4/6 handoff): no code here imports `hyper`
# directly -- it reaches our egress client transitively via reqwest. This
# is a floor pin, not a code dependency; see the workspace manifest entry
# for what upstream behaviour the pin evidences.
hyper                        = { workspace = true }
include_dir                 = { workspace = true }
percent-encoding            = { workspace = true }
hmac                        = { workspace = true }
subtle                      = { workspace = true }
qrcode                      = { workspace = true }
webauthn-rs                 = { workspace = true }
tempfile                    = { workspace = true }
sha2                        = { workspace = true }

# RFC 143 stage 2 part B: a static musl build has no system OpenSSL to
# link against (`webauthn-attestation-ca` -> `openssl` is the one
# transitive pull-in; see `cargo tree -i openssl-sys`). `vendored` makes
# openssl-sys compile OpenSSL's own C source and link it statically
# instead. Scoped to the musl target only (`cfg(target_env = "musl")`)
# so the ordinary glibc dev/CI build keeps using the system OpenSSL it
# already has, unchanged (confirmed: `ldd` on the glibc build still
# shows `libssl.so.3`/`libcrypto.so.3`, below). Cycle K stage 1 measured
# that OpenSSL is reachable -- every passkey verification goes through
# it (`webauthn-rs-core`'s `COSEKey::verify_signature`) -- so this is
# vendoring a dependency the binary actually uses, not merely satisfying
# an unreachable one's build requirements.
[target.'cfg(target_env = "musl")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[dev-dependencies]
# RFC 142 stage 5: `test-support` exposes `migrations::run_up_to` as `pub`
# (otherwise `pub(crate)`/`#[cfg(test)]`, unreachable from here) so this
# crate's own `tests/e2e/*.rs` can build a database at a known intermediate
# schema version through the real binary. Dev-only, the same shape as
# `sui-id-core`'s own `test-support` feature just below.
sui-id-store                = { workspace = true, features = ["test-support"] }
# Self dev-dependency: enables the test-support feature for this crate's tests only.
sui-id                     = { path = ".", features = ["test-support"] }
# Re-pull the core crate as a dev-dep with the `test-support`
# feature so e2e tests can construct `InMemoryHibpClient` /
# `InMemoryMailSender` from `core::test_support`. The library
# build of the same crate (no feature) is unaffected -- true since cycle J
# stage 10's review: before it, this line carried no feature and the
# `[dependencies]` entry above did, so every release build had the seam.
sui-id-core                 = { workspace = true, features = ["test-support"] }

proptest                    = { workspace = true }
tempfile                    = { workspace = true }
# RFC 094 M2a: raw database access is confined to sui-id-store; this crate's
# only use of rusqlite is in its own tests. Gate-asserted by `cargo xtask
# audit-structure`'s manifest check (`xtask/src/manifest.rs`, cycle J stage
# 10) -- the e2e test that used to assert this narrower scope on its own
# (`r094_m2a_db_access_scope.rs`) is retired, now that one gate checks it
# for every crate, [build-dependencies] included, not just this one under
# [dependencies].
rusqlite                    = { workspace = true }
# RFC 134 D4: a compile-fail proof that the `cookies` feature (a
# transitive dependency's, not this crate's own -- there is no `cfg` that
# can see a dependency's feature flags from outside it) stays off the
# federation egress client. See tests/compile_fail.rs.
trybuild                    = { workspace = true }
rustversion                 = { workspace = true }
# RFC 134 D3: a self-signed TLS mock upstream for the federation e2e
# tests, now that discovery and its endpoints must be `https`.
rcgen                        = { workspace = true }
tokio-rustls                 = { workspace = true }
# Test-only `UserSource` implementations (call counting, a source that
# answers with another identity) in the directory sign-in tests.
async-trait                 = { workspace = true }

tokio                       = { workspace = true }
tower                       = { workspace = true }
serde_json                  = { workspace = true }
url                         = { workspace = true }

base64ct                    = { workspace = true }
percent-encoding            = { workspace = true }
